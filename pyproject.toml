[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scitex-dev"
dynamic = ["version"]
description = "Shared developer utilities for the SciTeX ecosystem"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.9"
authors = [{name = "Yusuke Watanabe", email = "ywatanabe@scitex.ai"}]
keywords = ["scitex", "developer-tools", "documentation", "llm-friendly", "mcp"]

# Runtime deps. The console-script `scitex-dev` (see [project.scripts]) is a
# `click` group, so click is a HARD core dep, not an extra — bare
# `pip install scitex-dev` MUST give a working `scitex-dev --help`. (PS-213
# console-script-deps-must-be-core enforces this rule on every package with
# a [project.scripts] entry.)
#
# `newb` is NOT core: it is consumed only by the optional `scitex-dev skills
# self-explain` subcommand, which is lazy-imported inside that command (see
# src/scitex_dev/_cli/skills/_self_explain.py). Lifting newb out of core
# avoids dragging `claude-agent-sdk` (newb's heavy transitive) into every
# scitex-* leaf that pins scitex-dev. Install via `pip install
# scitex-dev[skills]` when you need self-explain.
dependencies = [
    "scitex-config>=0.3.0",
    "scitex-logging>=0.1.0",
    "click>=8.0.0",
    "pyyaml>=6.0",
    'tomli>=2.0; python_version < "3.11"',
]

[project.optional-dependencies]
# `cli` retained as a no-op alias for backward compat with users who wrote
# `pip install scitex-dev[cli]` before the click→core move (2026-06-10).
# Click now lives in `[project.dependencies]`; this extra adds nothing.
cli = []
mcp = ["fastmcp>=2.0.0"]
# `skills` powers `scitex-dev skills self-explain` (and `render_markdown`).
# Lazy-imported inside _cli/skills/_self_explain.py with an install hint
# referencing this extra name (PS-213 LAZY-EXTRA-PATTERN-OK).
skills = ["newb>=0.3.0"]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "fastmcp>=2.0.0",
    "textual>=0.50.0",
    # newb belongs to [skills] now. Re-listed here so the dev venv resolves
    # the lazy-import test path (PS-210 dev-extras-completeness: every
    # per-feature extra dep must also resolve in [dev]).
    "newb>=0.3.0",
    # tomlkit is consumed by `audit-umbrella --write` (umbrella-regen extra).
    # PS-210 §2 requires dev-extras-completeness: any dep behind a per-feature
    # extra must also be in `[dev]` so the full test suite resolves cleanly.
    "tomlkit>=0.12.0",
    # NOTE: do NOT add `scitex-dev>=X.Y` here — it creates an unresolvable
    # circular dependency in CI (the local editable install resolves to
    # `0.1.dev1+g<sha>` via setuptools-scm, which fails `>=0.11.5`). The
    # `scitex-dev` console script is provided by the package itself once
    # `pip install -e .[dev]` runs, so PS-150's `shutil.which` check still
    # works. If the meta-audit test must hard-fail (not skip) when the CLI
    # is absent, gate it explicitly rather than via this circular pin.
]
# `cli-audit` was originally (click, pyyaml) — both are core now. Kept as
# an empty no-op alias for backward compat.
cli-audit = []
# Optional extra for `scitex-dev ecosystem audit-umbrella --write` —
# tomlkit preserves comments + whitespace when regenerating the
# scitex-python umbrella's pyproject.toml [all] aggregator.
umbrella-regen = ["tomlkit>=0.12.0"]
tui = ["textual>=0.50.0"]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=2.0",
    "sphinx-copybutton>=0.5",
    "sphinx-autodoc-typehints>=1.25",
]
all = [
    "scitex-dev[mcp]",
    "scitex-dev[skills]",
    "scitex-dev[dev]",
    "scitex-dev[docs]",
    "scitex-dev[umbrella-regen]",
    "scitex-dev[tui]",
]

[project.scripts]
scitex-dev = "scitex_dev._cli:main"

[project.entry-points."scitex_dev.docs"]
scitex-dev = "scitex_dev"

[project.entry-points."scitex_dev.skills"]
scitex-dev = "scitex_dev"

# Federated scheduled-job providers. Each entry point loads to a callable
# returning `list[scitex_dev.jobs.JobSpec]`; `scitex_dev.jobs.discover_jobs()`
# aggregates them. scitex-dev's own built-ins are merged via an INTERNAL
# provider (not an entry point) so they are always present and never
# double-counted; this group is therefore reserved for *downstream*
# packages.
[project.entry-points."scitex_dev.jobs"]
# scitex-dev applies the dual-mode principle to itself: its own
# package-internal crons (ci-watch / quota-keepalive / worktree-gc /
# task-harvest / cred-distribute) live under the standalone
# `scitex-dev cron` CLI as JOB_REGISTRY entries; its ECOSYSTEM-LEVEL
# control-plane jobs (cross-package work) flow through the federation
# via the entry-point below, alongside every other leaf's provider.
scitex-dev-ecosystem = "scitex_dev._ecosystem_jobs._provider:provide_jobs"
# (downstream packages register here, e.g.)
# scitex-agent-container = "scitex_agent_container._jobs_plugin:provide_jobs"

[project.urls]
Homepage = "https://github.com/ywatanabe1989/scitex-dev"
Repository = "https://github.com/ywatanabe1989/scitex-dev"
Documentation = "https://scitex-dev.readthedocs.io/"

[tool.setuptools_scm]
# Empty body: derive version from latest git tag (vX.Y.Z → X.Y.Z).
# Eliminates pyproject↔tag drift; release flow is `git tag vX.Y.Z && git push --tags`.

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scitex_dev = [
    "skills/*.md",
    "skills/references/*.md",
    "_skills/**/*",
    "_branding/*.yaml",
    "_cli/audit/_summary/data/*",
    "_sphinx_html/**/*",
    "_sphinx_html/**/.[!.]*",
]

[tool.hatch.build.targets.wheel.force-include]
"src/scitex_dev/_skills" = "scitex_dev/_skills"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "skill_quality: structural checklist tests (§1–§4)",
    "skill_trigger: trigger-rate tests (live claude -p, slow, non-deterministic)",
]

# Subprocess coverage wiring: see
# src/scitex_dev/_skills/general/05_development_06_subprocess-coverage.md.
# parallel=true → each child writes its own .coverage.<host>.<pid> shard so
# `coverage combine` can merge them. concurrency covers both subprocess.run
# spawns and threaded test code. source pins to the import name so coverage
# excludes site-packages noise.
[tool.coverage.run]
parallel = true
source = ["scitex_dev"]
concurrency = ["multiprocessing", "thread"]
