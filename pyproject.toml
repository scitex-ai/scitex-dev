[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scitex-dev"
dynamic = ["version"]
description = "Shared developer utilities for the SciTeX ecosystem"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.9"
authors = [{name = "Yusuke Watanabe", email = "ywatanabe@scitex.ai"}]
keywords = ["scitex", "developer-tools", "documentation", "llm-friendly", "mcp"]

# Runtime deps. The console-script `scitex-dev` (see [project.scripts]) is a
# `click` group, so click is a HARD core dep, not an extra — bare
# `pip install scitex-dev` MUST give a working `scitex-dev --help`. (PS-213
# console-script-deps-must-be-core enforces this rule on every package with
# a [project.scripts] entry.)
#
# `newb` is NOT core: it is consumed only by the optional `scitex-dev skills
# self-explain` subcommand, which is lazy-imported inside that command (see
# src/scitex_dev/_cli/skills/_self_explain.py). Lifting newb out of core
# avoids dragging `claude-agent-sdk` (newb's heavy transitive) into every
# scitex-* leaf that pins scitex-dev. Install via `pip install
# scitex-dev[skills]` when you need self-explain.
# PS-225 / ADR-0005: extra NAMES are restricted to {all, dev, docs}, so every
# runtime capability lives here in core. There are exactly two installs —
# `pip install scitex-dev` (this list) and `pip install scitex-dev[all]`
# (this list plus the toolchain). Nothing in between, because a per-feature
# menu is what let container definitions pin `scitex-cards[mcp]` and lose
# psycopg fleet-wide on 2026-08-02.
#
# What moved here, and what it powers:
#   fastmcp        — the MCP server surface (was [mcp])
#   newb           — `scitex-dev skills self-explain` (was [skills])
#   scitex-ssh     — the scholar-library-sync cron job's `scitex-ssh sync`
#   scitex-scholar — that job's `library dedupe` / `library db build`
#                    (both were [sync]; CLI-invoked at cron runtime, so a
#                    missing script failed in a job log nobody was reading)
#   Pillow         — `_icons.generate_png` / `icons generate` PNG output
#                    (was [icons]; `generate_svg` is pure stdlib)
#   tomlkit        — `ecosystem audit-umbrella --write` (was [umbrella-regen])
#   textual        — the TUI dashboard (was [tui])
dependencies = [
    "scitex-config>=0.3.0",
    "scitex-logging>=0.1.0",
    "click>=8.0.0",
    "pyyaml>=6.0",
    'tomli>=2.0; python_version < "3.11"',
    # Promoted from the retired per-feature extras (see the block above): each
    # is imported by a code path that always runs when its verb is invoked, so
    # gating it behind an extra only moved the failure from install time to
    # call time.
    "fastmcp>=2.0.0",
    "newb>=0.3.0",
    "scitex-ssh>=1.1.0",
    "scitex-scholar>=1.4.3",
    "Pillow>=9.2.0",
    "tomlkit>=0.12.0",
    "textual>=0.50.0",
    # HARD dependency, not optional: _cli/audit/_project/_check_extras_all_closure.py
    # imports it at MODULE level, and _rules/__init__.py imports that module
    # unconditionally — so it is on the eager path of `import scitex_dev._cli`.
    # Undeclared until 2026-08-05 because pip/setuptools environments almost
    # always have it transitively; a clean `uv` venv does not, which is why it
    # only ever failed in CI.
    "packaging>=21.0",
    # SECOND INSTANCE OF THE DEFECT DIRECTLY ABOVE, found 2026-08-10 by
    # scitex-hub reporting that `scitex-dev[cli-audit]` provisions nothing.
    # It does not, but that extra was empty on purpose (its contents became
    # core). The real defect was this: `rich` was imported in EIGHT modules
    # and declared in NO dependency — not base, not any of the ten extras.
    #
    # Two of those imports are MODULE level and would fail at import:
    #     _cli/ecosystem/_dashboard/_render.py   from rich.table import Table
    #     _cli/ecosystem/_dashboard/_tui.py      from rich.text import Text
    #
    # The other six are function-local, which looks like optional-dependency
    # handling and is NOT: there is no `try/except ImportError` anywhere in
    # the tree. Deferring an import only moves the crash from load time to
    # call time. `rich` is required by every path that reaches it.
    #
    # Same reason it went unnoticed as `packaging` did — it arrives
    # transitively in most environments, so it is present exactly where
    # developers look and absent where CI runs.
    "rich>=13.0.0",
    # THIRD INSTANCE OF THE DEFECT DIRECTLY ABOVE, found 2026-08-13 while
    # moving scitex-agent-container's state onto the store. Measured on
    # scitex-compute-04: `scitex_dev.store` imports fine and psycopg reports
    # MISSING — so the host carries the Postgres backend and cannot open one.
    # PostgresDialect.connect imports psycopg lazily and raises a clear
    # DialectUnavailableError when it is absent, which is why this never
    # showed up as a crash and never showed up at import time either: the
    # only way to see it is to open a Postgres store, and nothing did until
    # ADR-0006 made Postgres the fleet's store.
    # That ADR is also why this belongs in core rather than an extra. The
    # comment block above this dependency list records what a per-feature
    # menu already cost us — pinning `scitex-cards[mcp]` lost psycopg
    # fleet-wide on 2026-08-02. It has been undeclared ever since.
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
# `cli` and `cli-audit` were empty no-op aliases kept for back-compat. They
# are DELETED rather than kept: `pip install scitex-dev[cli-audit]` installed
# nothing while reading like it enabled a capability, and that pin appeared 33
# times in this repo's own documentation — the reader believed they had
# complied. PS-214 has been reporting both all along, into a `--new-only`
# gate where a pre-existing finding is invisible by construction.
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    # pytest-timeout: per-test wall-clock cap (see [tool.pytest.ini_options]
    # `timeout`). A single hung test fails loud + names itself in ~5 min
    # instead of wedging the whole job until GitHub's 6h ceiling.
    "pytest-timeout>=2.1.0",
    # pytest-xdist: parallelise the suite across ALL cores of the self-hosted
    # Spartan CPU lease (.github/ci/run-in-sif.sh runs `pytest -n "$(nproc)"
    # --dist loadscope`). Already baked into the reused ci-cpu SIF; pinned here
    # so a plain `pip install -e .[dev]` resolves the same parallel test path
    # (PS-210 dev-extras-completeness).
    "pytest-xdist>=3.0.0",
    "fastmcp>=2.0.0",
    "textual>=0.50.0",
    # newb belongs to [skills] now. Re-listed here so the dev venv resolves
    # the lazy-import test path (PS-210 dev-extras-completeness: every
    # per-feature extra dep must also resolve in [dev]).
    "newb>=0.3.0",
    # tomlkit is consumed by `audit-umbrella --write` (umbrella-regen extra).
    # PS-210 §2 requires dev-extras-completeness: any dep behind a per-feature
    # extra must also be in `[dev]` so the full test suite resolves cleanly.
    "tomlkit>=0.12.0",
    # Pillow belongs to [icons] now (generate_png / save_icon PNG output).
    # Re-listed here so the dev venv resolves the lazy-import test path
    # (PS-210 dev-extras-completeness).
    "Pillow>=9.2.0",
    # NOTE: do NOT add `scitex-dev>=X.Y` here — it creates an unresolvable
    # circular dependency in CI (the local editable install resolves to
    # `0.1.dev1+g<sha>` via setuptools-scm, which fails `>=0.11.5`). The
    # `scitex-dev` console script is provided by the package itself once
    # `pip install -e .[dev]` runs, so PS-150's `shutil.which` check still
    # works. If the meta-audit test must hard-fail (not skip) when the CLI
    # is absent, gate it explicitly rather than via this circular pin.
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=2.0",
    "sphinx-copybutton>=0.5",
    "sphinx-autodoc-typehints>=1.25",
]
all = [
    "scitex-dev[dev]",
    "scitex-dev[docs]",
]

[project.scripts]
scitex-dev = "scitex_dev._cli:main"
scitex-dev-testmon = "scitex_dev._hooks.run_testmon_cli:main"

# Auto-loaded pytest guard: enforces a package's test-execution recipe
# (mode=remote-required blocks local pytest). Inert by default (default mode is
# `local`, and a package with no recipe resolves to that), so this never
# affects scitex-dev's own CI or any package that has not opted in.
[project.entry-points."pytest11"]
scitex_dev_test_execution = "scitex_dev._core._test_execution_plugin"

[project.entry-points."scitex_dev.docs"]
scitex-dev = "scitex_dev"

[project.entry-points."scitex_dev.skills"]
scitex-dev = "scitex_dev"

# Federated scheduled-job providers. Each entry point loads to a callable
# returning `list[scitex_dev.jobs.JobSpec]`; `scitex_dev.jobs.discover_jobs()`
# aggregates them. scitex-dev's own built-ins are merged via an INTERNAL
# provider (not an entry point) so they are always present and never
# double-counted; this group is therefore reserved for *downstream*
# packages.
[project.entry-points."scitex_dev.jobs"]
# scitex-dev applies the dual-mode principle to itself: its own
# package-internal crons (ci-watch / quota-keepalive / worktree-gc /
# task-harvest / cred-distribute) live under the standalone
# `scitex-dev cron` CLI as JOB_REGISTRY entries; its ECOSYSTEM-LEVEL
# control-plane jobs (cross-package work) flow through the federation
# via the entry-point below, alongside every other leaf's provider.
scitex-dev-ecosystem = "scitex_dev._ecosystem_jobs._provider:provide_jobs"
# (downstream packages register here, e.g.)
# scitex-agent-container = "scitex_agent_container._jobs_plugin:provide_jobs"

# Federated SYSTEM (apt) dependency providers live under the entry-point group
# `scitex_dev.system_deps`. Each entry point loads to a callable returning
# `list[scitex_dev.system_deps.SystemDepSpec]`;
# `scitex_dev.system_deps.discover_system_deps()` aggregates them (deduped by
# apt package). Replaces hardcoding apt lists in container defs. Install is
# BUILD-time/root only, via `scitex-dev ecosystem system-deps --install` in a
# container %post. Downstream leaves register like so:
#   scitex-writer = "scitex_writer._system_deps:provide"
#   scitex-audio  = "scitex_audio._system_deps:provide"
[project.entry-points."scitex_dev.system_deps"]
# scitex-dev's own (first) declaration: rsync, required by the
# scholar-library-sync managed cron job (scitex-ssh sync wraps rsync).
scitex-dev = "scitex_dev._system_deps:provide"

# Federated HOST-LEVEL configuration providers live under the entry-point group
# `scitex_dev.host_config`. Each entry point loads to a callable returning
# `list[scitex_dev.host_config.HostConfigSpec]`;
# `scitex_dev.host_config.discover_host_config()` aggregates them (deduped by
# name, and by target path). Replaces configuring hosts by hand with sudo --
# an ad-hoc privileged session leaves no record, so months later nobody can
# tell deliberate configuration from drift (operator ruling 2026-08-12).
# CHECKING is unprivileged and runs on the `host-config-check` timer; APPLYING
# needs root and is deliberate: `sudo scitex-dev ecosystem host-config apply
# --yes`.
#
# scitex-dev's OWN declaration (persistent journald) is merged through an
# INTERNAL provider -- `host_config._builtin_host_config` -- NOT an entry point,
# exactly as `jobs._builtin_jobs` is. Entry-point metadata lives in the
# INSTALLED dist-info, so an editable checkout that has not been reinstalled
# advertises the OLD set; for the declaration that keeps a host's forensic
# logging alive, that is a silent per-host disappearance. This group is
# therefore reserved for DOWNSTREAM packages, which register like so:
#   scitex-agent-container = "scitex_agent_container._host_config:provide"
[project.entry-points."scitex_dev.host_config"]

# Federated SUBMISSION-GATE check providers live under the entry-point group
# `scitex_dev.gate.checks`. Each entry point loads to a callable returning
# `list[scitex_dev.gate.GateCheck]`; `scitex_dev.gate.discover_gate_checks()`
# aggregates them (deduped by check id). The `scitex-dev gate` CLI runs them
# so a hook depends ONLY on scitex-dev. scitex-dev ships its own built-in
# check via an INTERNAL provider (always merged, not an entry point), so it
# declares no provider here; this group is for downstream leaves, e.g.:
#   scitex-clew    = "scitex_clew._gate_plugin:provide"
#   scitex-dataset = "scitex_dataset._gate_plugin:provide"

# Federated STORE providers live under the entry-point group
# `scitex_dev.store.plugins`. Each entry point loads to a callable returning
# `list[scitex_dev.store.StorePlugin]`;
# `scitex_dev.store.discover_store_plugins()` aggregates them (deduped by
# store name, first-wins). A leaf declares the part only it can know — which
# of ITS fields are immutable, last-writer-wins, append-only — because a
# merge rule guessed by scitex-dev would lose data without raising. It does
# NOT resolve its own store target; `scitex_dev.store.resolve_target()` does
# that, centrally, because per-consumer resolution is what let one host reach
# two Postgres instances that both answered to one store_uuid on 2026-08-11.
#
# scitex-dev ships its own store (the status exchange ledger) via an INTERNAL
# provider — always merged, never an entry point, so it cannot be lost to a
# missing .dist-info or double-counted by a leaf that vendored it. It
# therefore declares no provider here; this group is for downstream leaves:
#   scitex-agent-container = "scitex_agent_container._store_plugin:provide"
#   scitex-cards           = "scitex_cards._store_plugin:provide"

[project.urls]
Homepage = "https://github.com/scitex-ai/scitex-dev"
Repository = "https://github.com/scitex-ai/scitex-dev"
Documentation = "https://scitex-dev.readthedocs.io/"

[tool.setuptools_scm]
# Empty body: derive version from latest git tag (vX.Y.Z → X.Y.Z).
# Eliminates pyproject↔tag drift; release flow is `git tag vX.Y.Z && git push --tags`.

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scitex_dev = [
    "skills/*.md",
    "skills/references/*.md",
    "_skills/**/*",
    "_hooks/*.sh",
    "_branding/*.yaml",
    "_cli/audit/_summary/data/*",
    "linter/_rules/_verb_lexicon.txt",
    "_sphinx_html/**/*",
    "_sphinx_html/**/.[!.]*",
    "_ecosystem/ci_template/templates/*.tmpl",
    # ADR-0007: the language-independent status spec is the SOURCE OF TRUTH and
    # the Python is derived from it, so it must SHIP. A repo-root spec/ would
    # not travel in the wheel, and an installed consumer would then need a
    # second copy — two copies of an SSoT being the defect the rule exists to
    # prevent. The validator raises rather than degrading if these are absent:
    # an empty table validates nothing, so every malformed value would pass.
    "status/spec/*.md",
    "status/spec/*.yaml",
    "status/spec/schema/*.json",
]

[tool.hatch.build.targets.wheel.force-include]
"src/scitex_dev/_skills" = "scitex_dev/_skills"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Per-test wall-clock cap (pytest-timeout, in [dev]). The whole suite runs in
# ~2 min, so any single test exceeding 300 s is wedged: fail it loud + name it
# rather than spinning to GitHub's 6 h job ceiling. The default "signal" method
# interrupts a stuck Python loop and lets the rest of the suite still run. If
# pytest-timeout is absent (plain `pip install -e .` fallback), pytest just
# warns "Unknown config option: timeout" — no error.
timeout = 300
markers = [
    "skill_quality: structural checklist tests (§1–§4)",
    "skill_trigger: trigger-rate tests (live claude -p, slow, non-deterministic)",
]

# Subprocess coverage wiring: see
# src/scitex_dev/_skills/general/05_development_06_subprocess-coverage.md.
# parallel=true → each child writes its own .coverage.<host>.<pid> shard so
# `coverage combine` can merge them. concurrency covers both subprocess.run
# spawns and threaded test code. source pins to the import name so coverage
# excludes site-packages noise.
[tool.coverage.run]
parallel = true
source = ["scitex_dev"]
concurrency = ["multiprocessing", "thread"]

[tool.scitex_dev.audit]
# PS-168 — Per-package secret + env-var prefix in GitHub Actions workflows.
# `GH_PERSONAL_ACCESS_TOKEN` is the ecosystem-wide cross-cutting PAT used
# by the contributor-assistant CLA action. The natural GITHUB_* namespace
# is reserved by GitHub Actions on the secret-name surface (HTTP 422 on
# every `gh secret set`), so the GH_ shorthand is the canonical
# substitute and is registered ecosystem-wide via PR #122 on scitex-dev
# (EXCEPTION_SECRETS_DEFAULT). This per-package entry pins the same
# exception inline so the audit passes on every scitex-dev version,
# independent of release timing.
ps168_secret_exceptions = ["GH_PERSONAL_ACCESS_TOKEN"]
