[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scitex-dev"
dynamic = ["version"]
description = "Shared developer utilities for the SciTeX ecosystem"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.9"
authors = [{name = "Yusuke Watanabe", email = "ywatanabe@scitex.ai"}]
keywords = ["scitex", "developer-tools", "documentation", "llm-friendly", "mcp"]

# Runtime deps. The console-script `scitex-dev` (see [project.scripts]) is a
# `click` group, so click is a HARD core dep, not an extra — bare
# `pip install scitex-dev` MUST give a working `scitex-dev --help`. (PS-213
# console-script-deps-must-be-core enforces this rule on every package with
# a [project.scripts] entry.)
#
# `newb` is NOT core: it is consumed only by the optional `scitex-dev skills
# self-explain` subcommand, which is lazy-imported inside that command (see
# src/scitex_dev/_cli/skills/_self_explain.py). Lifting newb out of core
# avoids dragging `claude-agent-sdk` (newb's heavy transitive) into every
# scitex-* leaf that pins scitex-dev. Install via `pip install
# scitex-dev[skills]` when you need self-explain.
dependencies = [
    "scitex-config>=0.3.0",
    "scitex-logging>=0.1.0",
    "click>=8.0.0",
    "pyyaml>=6.0",
    'tomli>=2.0; python_version < "3.11"',
]

[project.optional-dependencies]
# `cli` retained as a no-op alias for backward compat with users who wrote
# `pip install scitex-dev[cli]` before the click→core move (2026-06-10).
# Click now lives in `[project.dependencies]`; this extra adds nothing.
cli = []
mcp = ["fastmcp>=2.0.0"]
# `skills` powers `scitex-dev skills self-explain` (and `render_markdown`).
# Lazy-imported inside _cli/skills/_self_explain.py with an install hint
# referencing this extra name (PS-213 LAZY-EXTRA-PATTERN-OK).
skills = ["newb>=0.3.0"]
# `sync` powers the scholar-library-sync managed cron job, whose shell line
# calls the `scitex-ssh sync` console script (sync_dir primitive, first
# shipped in scitex-ssh 1.1.0) and `scitex-scholar library dedupe` /
# `library db build` (dedupe first shipped in scitex-scholar 1.4.3).
# CLI-invoked at cron runtime, not imported — a missing script fails
# loudly in the job log with this extra as the hint.
sync = ["scitex-ssh>=1.1.0", "scitex-scholar>=1.4.3"]
# `icons` powers `scitex_dev._icons.generate_png` / `save_icon(...,
# formats=(..., "png"))` and the `scitex-dev icons generate` CLI's PNG
# output. Lazy-imported inside `_icons/__init__.py` (PS-213
# LAZY-EXTRA-PATTERN-OK) -- `generate_svg` alone (pure stdlib) never
# requires this extra.
icons = ["Pillow>=9.2.0"]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    # pytest-timeout: per-test wall-clock cap (see [tool.pytest.ini_options]
    # `timeout`). A single hung test fails loud + names itself in ~5 min
    # instead of wedging the whole job until GitHub's 6h ceiling.
    "pytest-timeout>=2.1.0",
    # pytest-xdist: parallelise the suite across ALL cores of the self-hosted
    # Spartan CPU lease (.github/ci/run-in-sif.sh runs `pytest -n "$(nproc)"
    # --dist loadscope`). Already baked into the reused ci-cpu SIF; pinned here
    # so a plain `pip install -e .[dev]` resolves the same parallel test path
    # (PS-210 dev-extras-completeness).
    "pytest-xdist>=3.0.0",
    "fastmcp>=2.0.0",
    "textual>=0.50.0",
    # newb belongs to [skills] now. Re-listed here so the dev venv resolves
    # the lazy-import test path (PS-210 dev-extras-completeness: every
    # per-feature extra dep must also resolve in [dev]).
    "newb>=0.3.0",
    # tomlkit is consumed by `audit-umbrella --write` (umbrella-regen extra).
    # PS-210 §2 requires dev-extras-completeness: any dep behind a per-feature
    # extra must also be in `[dev]` so the full test suite resolves cleanly.
    "tomlkit>=0.12.0",
    # Pillow belongs to [icons] now (generate_png / save_icon PNG output).
    # Re-listed here so the dev venv resolves the lazy-import test path
    # (PS-210 dev-extras-completeness).
    "Pillow>=9.2.0",
    # NOTE: do NOT add `scitex-dev>=X.Y` here — it creates an unresolvable
    # circular dependency in CI (the local editable install resolves to
    # `0.1.dev1+g<sha>` via setuptools-scm, which fails `>=0.11.5`). The
    # `scitex-dev` console script is provided by the package itself once
    # `pip install -e .[dev]` runs, so PS-150's `shutil.which` check still
    # works. If the meta-audit test must hard-fail (not skip) when the CLI
    # is absent, gate it explicitly rather than via this circular pin.
]
# `cli-audit` was originally (click, pyyaml) — both are core now. Kept as
# an empty no-op alias for backward compat.
cli-audit = []
# Optional extra for `scitex-dev ecosystem audit-umbrella --write` —
# tomlkit preserves comments + whitespace when regenerating the
# scitex-python umbrella's pyproject.toml [all] aggregator.
umbrella-regen = ["tomlkit>=0.12.0"]
tui = ["textual>=0.50.0"]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=2.0",
    "sphinx-copybutton>=0.5",
    "sphinx-autodoc-typehints>=1.25",
]
all = [
    "scitex-dev[mcp]",
    "scitex-dev[skills]",
    "scitex-dev[sync]",
    "scitex-dev[dev]",
    "scitex-dev[docs]",
    "scitex-dev[umbrella-regen]",
    "scitex-dev[tui]",
]

[project.scripts]
scitex-dev = "scitex_dev._cli:main"
scitex-dev-testmon = "scitex_dev._hooks.run_testmon_cli:main"

# Auto-loaded pytest guard: enforces a package's test-execution recipe
# (mode=remote-required blocks local pytest). Inert by default (default mode is
# `local`, and a package with no recipe resolves to that), so this never
# affects scitex-dev's own CI or any package that has not opted in.
[project.entry-points."pytest11"]
scitex_dev_test_execution = "scitex_dev._core._test_execution_plugin"

[project.entry-points."scitex_dev.docs"]
scitex-dev = "scitex_dev"

[project.entry-points."scitex_dev.skills"]
scitex-dev = "scitex_dev"

# Federated scheduled-job providers. Each entry point loads to a callable
# returning `list[scitex_dev.jobs.JobSpec]`; `scitex_dev.jobs.discover_jobs()`
# aggregates them. scitex-dev's own built-ins are merged via an INTERNAL
# provider (not an entry point) so they are always present and never
# double-counted; this group is therefore reserved for *downstream*
# packages.
[project.entry-points."scitex_dev.jobs"]
# scitex-dev applies the dual-mode principle to itself: its own
# package-internal crons (ci-watch / quota-keepalive / worktree-gc /
# task-harvest / cred-distribute) live under the standalone
# `scitex-dev cron` CLI as JOB_REGISTRY entries; its ECOSYSTEM-LEVEL
# control-plane jobs (cross-package work) flow through the federation
# via the entry-point below, alongside every other leaf's provider.
scitex-dev-ecosystem = "scitex_dev._ecosystem_jobs._provider:provide_jobs"
# (downstream packages register here, e.g.)
# scitex-agent-container = "scitex_agent_container._jobs_plugin:provide_jobs"

# Federated SYSTEM (apt) dependency providers live under the entry-point group
# `scitex_dev.system_deps`. Each entry point loads to a callable returning
# `list[scitex_dev.system_deps.SystemDepSpec]`;
# `scitex_dev.system_deps.discover_system_deps()` aggregates them (deduped by
# apt package). Replaces hardcoding apt lists in container defs. Install is
# BUILD-time/root only, via `scitex-dev ecosystem system-deps --install` in a
# container %post. Downstream leaves register like so:
#   scitex-writer = "scitex_writer._system_deps:provide"
#   scitex-audio  = "scitex_audio._system_deps:provide"
[project.entry-points."scitex_dev.system_deps"]
# scitex-dev's own (first) declaration: rsync, required by the
# scholar-library-sync managed cron job (scitex-ssh sync wraps rsync).
scitex-dev = "scitex_dev._system_deps:provide"

# Federated SUBMISSION-GATE check providers live under the entry-point group
# `scitex_dev.gate.checks`. Each entry point loads to a callable returning
# `list[scitex_dev.gate.GateCheck]`; `scitex_dev.gate.discover_gate_checks()`
# aggregates them (deduped by check id). The `scitex-dev gate` CLI runs them
# so a hook depends ONLY on scitex-dev. scitex-dev ships its own built-in
# check via an INTERNAL provider (always merged, not an entry point), so it
# declares no provider here; this group is for downstream leaves, e.g.:
#   scitex-clew    = "scitex_clew._gate_plugin:provide"
#   scitex-dataset = "scitex_dataset._gate_plugin:provide"

[project.urls]
Homepage = "https://github.com/ywatanabe1989/scitex-dev"
Repository = "https://github.com/ywatanabe1989/scitex-dev"
Documentation = "https://scitex-dev.readthedocs.io/"

[tool.setuptools_scm]
# Empty body: derive version from latest git tag (vX.Y.Z → X.Y.Z).
# Eliminates pyproject↔tag drift; release flow is `git tag vX.Y.Z && git push --tags`.

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scitex_dev = [
    "skills/*.md",
    "skills/references/*.md",
    "_skills/**/*",
    "_hooks/*.sh",
    "_branding/*.yaml",
    "_cli/audit/_summary/data/*",
    "linter/_rules/_verb_lexicon.txt",
    "_sphinx_html/**/*",
    "_sphinx_html/**/.[!.]*",
    "_ecosystem/ci_template/templates/*.tmpl",
]

[tool.hatch.build.targets.wheel.force-include]
"src/scitex_dev/_skills" = "scitex_dev/_skills"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Per-test wall-clock cap (pytest-timeout, in [dev]). The whole suite runs in
# ~2 min, so any single test exceeding 300 s is wedged: fail it loud + name it
# rather than spinning to GitHub's 6 h job ceiling. The default "signal" method
# interrupts a stuck Python loop and lets the rest of the suite still run. If
# pytest-timeout is absent (plain `pip install -e .` fallback), pytest just
# warns "Unknown config option: timeout" — no error.
timeout = 300
markers = [
    "skill_quality: structural checklist tests (§1–§4)",
    "skill_trigger: trigger-rate tests (live claude -p, slow, non-deterministic)",
]

# Subprocess coverage wiring: see
# src/scitex_dev/_skills/general/05_development_06_subprocess-coverage.md.
# parallel=true → each child writes its own .coverage.<host>.<pid> shard so
# `coverage combine` can merge them. concurrency covers both subprocess.run
# spawns and threaded test code. source pins to the import name so coverage
# excludes site-packages noise.
[tool.coverage.run]
parallel = true
source = ["scitex_dev"]
concurrency = ["multiprocessing", "thread"]

[tool.scitex_dev.audit]
# PS-168 — Per-package secret + env-var prefix in GitHub Actions workflows.
# `GH_PERSONAL_ACCESS_TOKEN` is the ecosystem-wide cross-cutting PAT used
# by the contributor-assistant CLA action. The natural GITHUB_* namespace
# is reserved by GitHub Actions on the secret-name surface (HTTP 422 on
# every `gh secret set`), so the GH_ shorthand is the canonical
# substitute and is registered ecosystem-wide via PR #122 on scitex-dev
# (EXCEPTION_SECRETS_DEFAULT). This per-package entry pins the same
# exception inline so the audit passes on every scitex-dev version,
# independent of release timing.
ps168_secret_exceptions = ["GH_PERSONAL_ACCESS_TOKEN"]
