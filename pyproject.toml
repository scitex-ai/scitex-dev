[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scitex-dev"
version = "0.10.11"
description = "Shared developer utilities for the SciTeX ecosystem"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.9"
authors = [{name = "Yusuke Watanabe", email = "ywatanabe@scitex.ai"}]
keywords = ["scitex", "developer-tools", "documentation", "llm-friendly", "mcp"]

# Runtime deps: scitex-config (layered priority + local_state) and tomli on
# 3.10 (tomllib is stdlib only from 3.11+; the pyproject linter needs it).
dependencies = [
    "scitex-config>=0.3.0",
    'tomli>=2.0; python_version < "3.11"',
]

[project.optional-dependencies]
cli = ["click>=8.0.0"]
mcp = ["fastmcp>=2.0.0"]
dev = ["click>=8.0.0", "pytest>=7.0.0", "pytest-cov>=4.0.0"]
cli-audit = ["click>=8.0.0", "pyyaml>=6.0"]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=2.0",
    "sphinx-copybutton>=0.5",
    "sphinx-autodoc-typehints>=1.25",
]
all = [
    "scitex-dev[cli]",
    "scitex-dev[mcp]",
    "scitex-dev[dev]",
    "scitex-dev[docs]",
    "scitex-dev[cli-audit]",
]

[project.scripts]
scitex-dev = "scitex_dev._cli:main"

[project.entry-points."scitex_dev.docs"]
scitex-dev = "scitex_dev"

[project.entry-points."scitex_dev.skills"]
scitex-dev = "scitex_dev"

[project.urls]
Homepage = "https://github.com/ywatanabe1989/scitex-dev"
Repository = "https://github.com/ywatanabe1989/scitex-dev"
Documentation = "https://scitex-dev.readthedocs.io/"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scitex_dev = ["skills/*.md", "skills/references/*.md", "_skills/**/*", "_cli_audit/data/*"]

[tool.hatch.build.targets.wheel.force-include]
"src/scitex_dev/_skills" = "scitex_dev/_skills"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "skill_quality: structural checklist tests (§1–§4)",
    "skill_trigger: trigger-rate tests (live claude -p, slow, non-deterministic)",
]
