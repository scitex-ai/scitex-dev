name: release-ci

# Consolidated post-merge / scheduled CI gate. Runs the FULL matrix on every
# push to main/develop and on the nightly cron — this is the protected-branch
# gate. PR-time runs go through pr-ci.yml (which trims docs-only edits and
# can short-circuit the matrix; release-ci.yml never short-circuits).
#
# Includes:
#   * import-smoke  — confirms `pip install -e .` + `import scitex_dev` work
#                     on the canonical Python (3.12), no extras.
#   * tests         — full pytest matrix 3.11/3.12/3.13 with coverage upload.
#
# Triggers:
#   * push to main / develop
#   * nightly cron 07:00 UTC (matches the pre-split per-workflow schedule)
#   * manual dispatch

on:
  push:
    branches: [main, develop]
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  import-smoke:
    name: import-smoke-on-ubuntu-py3-12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Set up Python 3.12 (uv-managed)
        run: uv python install 3.12
      - name: Install (no extras) in uv venv
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -e .
      - name: Import smoke
        run: .venv/bin/python -c "import scitex_dev; print(scitex_dev.__version__)"

  tests:
    name: pytest-matrix-on-ubuntu-py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Install fd (Rust file finder; audit file discovery requires it)
        run: |
          sudo apt-get update && sudo apt-get install -y fd-find
          fdfind --version
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Set up Python ${{ matrix.python-version }} (uv-managed)
        run: uv python install ${{ matrix.python-version }}
      - name: Create uv venv on this matrix Python
        run: uv venv --python ${{ matrix.python-version }} .venv
      - name: Install dependencies
        run: |
          uv pip install --python .venv/bin/python -e ".[all,dev]" \
            || uv pip install --python .venv/bin/python -e ".[dev]" \
            || uv pip install --python .venv/bin/python -e .
      - name: Run tests
        run: |
          .venv/bin/pytest tests/ --cov=src/scitex_dev --cov-report=xml --cov-report=term
      - name: Upload coverage to Codecov
        if: always() && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false
