name: docs

on:
  push:
    branches: [main, develop]
  pull_request:


jobs:
  full-original-docs:
    uses: scitex-ai/.github/.github/workflows/rtd-sphinx-build.yml@fccc4199f3417128985a7ecd58891646bb61ed1b
    with:
      dev_original_commands: true
      # Publish generated HTML through a source-bound draft PR, preserving protection.
      bundle_dir: src/scitex_dev/_sphinx_html
      runs_on: '["self-hosted","Linux","X64","scitex-org-cpu"]'
    if: "!contains(github.event.head_commit.message, 'docs(sphinx_html): refresh from CI build')"
    permissions:
      contents: write
      # GitHub validates every nested job, including the bundle publisher.
      pull-requests: write

  sphinx:
    name: sphinx
    needs: full-original-docs
    if: "always() && (!contains(github.event.head_commit.message, 'docs(sphinx_html): refresh from CI build'))"
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Propagate the full original validation result
        env:
          FULL_RESULT: ${{ needs.full-original-docs.result }}
        run: |
          case "$FULL_RESULT" in
            success) ;;
            *) printf '%s\n' "Full original validation result: $FULL_RESULT" >&2; exit 1 ;;
          esac
