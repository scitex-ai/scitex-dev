name: tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 17 * * *"  # nightly 17:00 UTC (~02:00 JST), off-peak
  workflow_dispatch:

jobs:
  # 2026-07-10 incident remediation: centralized as an org-level reusable
  # workflow at scitex-ai/.github (pilot: PR #69 on scitex-ai/scitex-stats).
  # Only this job body changes — on:/concurrency:/permissions: above stay
  # byte-identical to the pre-migration file.
  pytest-matrix:
    # New required-status-check contexts: "pytest-matrix / pytest-matrix-on-ubuntu-py3.11" / "...py3.12" / "...py3.13"
    uses: scitex-ai/.github/.github/workflows/pytest-matrix.yml@main
    secrets: inherit
