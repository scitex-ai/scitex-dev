name: tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 17 * * *"  # nightly 17:00 UTC (~02:00 JST), off-peak
  workflow_dispatch:

jobs:
  test:
    # Job name is a REQUIRED status check (branch protection):
    # pytest-matrix-on-ubuntu-py3.11 / 3.12 / 3.13 — keep verbatim.
    name: pytest-matrix-on-ubuntu-py${{ matrix.python-version }}
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","Linux","X64","scitex-ci"]') }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Create per-job venv (self-hosted shared-cache isolation)
        # Self-hosted runners share one read-only tool-cache + home, so
        # pip-installing into the base interpreter is blocked (PEP 668) and
        # would race across repos. A per-job venv on the runner's local
        # $RUNNER_TEMP isolates deps; GITHUB_PATH makes later steps use it.
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Fallback chain: prefer [all,dev] so optional-dep code paths
          # (yaml, fastmcp, textual) get exercised. Falls back to [dev] then
          # plain editable so a packaging hiccup doesn't strand CI.
          pip install -e ".[all,dev]" || pip install -e ".[dev]" || pip install -e .
      - name: Run tests
        # -n auto: parallelise across all runner cores (pytest-xdist, in [dev]).
        # Each worker is a separate process, so matplotlib/global state stays
        # isolated per worker — the safe way to parallelise the suite. Serial
        # runs overran the old cap (~28 min); -n auto brings it to minutes.
        # NO $SCITEX_STORE_DSN, AND ITS ABSENCE IS THE POINT.
        #
        # This step used to set
        #     SCITEX_STORE_DSN: postgresql://ywatanabe__scitex-dev@scitex-primary:55432/scitex
        # which pointed the store suite at the LIVE FLEET PRIMARY and the
        # production `scitex` database, creating throwaway SCHEMAS there. That
        # was not carelessness — the CI image shipped no PostgreSQL at all, so
        # `writable_dsn()`'s throwaway-cluster route could never run and naming
        # the primary was the only thing that worked.
        #
        # IT BROKE A RELEASE. On 2026-08-30 three xdist-parallel matrix legs
        # exhausted the primary's connection slots (max_connections=100, ~24 in
        # use at idle):
        #     FATAL: remaining connection slots are reserved for roles with the
        #            SUPERUSER attribute
        #     FATAL: sorry, too many clients already
        # v0.58.0's release job failed with 9 problems out of 7432 tests, every
        # one a connection refusal rather than a defect, and re-running the
        # failed leg ALONE still reproduced it. The blast radius is the fleet,
        # not the build: CI competes with every agent's card write for the same
        # 100 slots. A test suite must not be able to deny service to the
        # production board.
        #
        # WITH NO DSN SET, `writable_dsn()` falls through to
        # `ephemeral_cluster_dsn()` — initdb + pg_ctl on a unix socket in a temp
        # dir, trust auth, torn down at session end. Fully isolated, no fleet
        # dependency, and nothing of ours is reachable from a test.
        #
        # PREREQUISITE, ALREADY SATISFIED: the CI image must contain the
        # PostgreSQL SERVER. Added in the ci-cpu recipe, rebuilt and verified on
        # every runner in the `scitex-org-cpu` pool (compute-01..04) —
        # `initdb (PostgreSQL) 16.15` present in the new image, absent in the
        # old one. Rebuild with the recipe at
        # src/scitex_dev/ci/runner/containers/ci-cpu.def if a runner is ever
        # rebuilt from scratch.
        run: |
          pytest tests/ -n auto --cov=src/scitex_dev --cov-report=xml --cov-report=term
      - name: Upload coverage to Codecov
        if: always() && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        env:
          # Per-job isolated HOME so parallel matrix jobs don't race on the
          # codecov uploader's state under $HOME, and so the uploader's
          # internal `git` calls don't trip "dubious ownership" on the
          # shared checkout. Paired with disable_safe_directory below.
          HOME: ${{ runner.temp }}/codecov-home-${{ matrix.python-version }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false
          disable_safe_directory: true
