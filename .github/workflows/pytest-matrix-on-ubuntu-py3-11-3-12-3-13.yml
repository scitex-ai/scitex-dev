name: tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 17 * * *"  # nightly 17:00 UTC (~02:00 JST), off-peak
  workflow_dispatch:

jobs:
  test:
    # Job name is a REQUIRED status check (branch protection):
    # pytest-matrix-on-ubuntu-py3.11 / 3.12 / 3.13 — keep verbatim.
    name: pytest-matrix-on-ubuntu-py${{ matrix.python-version }}
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","Linux","X64","scitex-ci"]') }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Create per-job venv (self-hosted shared-cache isolation)
        # Self-hosted runners share one read-only tool-cache + home, so
        # pip-installing into the base interpreter is blocked (PEP 668) and
        # would race across repos. A per-job venv on the runner's local
        # $RUNNER_TEMP isolates deps; GITHUB_PATH makes later steps use it.
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Fallback chain: prefer [all,dev] so optional-dep code paths
          # (yaml, fastmcp, textual) get exercised. Falls back to [dev] then
          # plain editable so a packaging hiccup doesn't strand CI.
          pip install -e ".[all,dev]" || pip install -e ".[dev]" || pip install -e .
      - name: DIAG config-discovery (temporary)
        run: |
          echo "TMPDIR=${TMPDIR:-<unset>} HOME=$HOME PWD=$PWD RUNNER_TEMP=$RUNNER_TEMP"
          python - <<'PY'
          import tempfile, sys
          from pathlib import Path
          from scitex_dev.linter.config import load_config
          from scitex_dev.linter._project_type import detect_scitex_dev_project_types
          d = Path(tempfile.mkdtemp())
          (d / ".scitex" / "dev").mkdir(parents=True)
          (d / ".scitex" / "dev" / "config.yaml").write_text("project-type: pip\n")
          rs = Path(str(d)).resolve()
          print("tmp_path =", d)
          print("resolved =", rs)
          print("detect   =", detect_scitex_dev_project_types(rs))
          print("enable   =", load_config(start_path=str(d)).enable)
          cur = rs
          while True:
              c = cur / ".scitex" / "dev" / "config.yaml"
              if c.is_file():
                  print("WALK-UP FOUND:", c, "->", repr(c.read_text()[:120])); break
              if cur.parent == cur:
                  print("WALK-UP: no config to root"); break
              cur = cur.parent
          PY
      - name: Run tests
        run: |
          pytest tests/ --cov=src/scitex_dev --cov-report=xml --cov-report=term
      - name: Upload coverage to Codecov
        if: always() && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        env:
          # Per-job isolated HOME so parallel matrix jobs don't race on the
          # codecov uploader's state under $HOME, and so the uploader's
          # internal `git` calls don't trip "dubious ownership" on the
          # shared checkout. Paired with disable_safe_directory below.
          HOME: ${{ runner.temp }}/codecov-home-${{ matrix.python-version }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false
          disable_safe_directory: true
