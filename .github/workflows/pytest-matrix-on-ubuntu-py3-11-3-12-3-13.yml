name: tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 17 * * *"  # nightly 17:00 UTC (~02:00 JST), off-peak
  workflow_dispatch:

jobs:
  test:
    # Job name is a REQUIRED status check (branch protection):
    # pytest-matrix-on-ubuntu-py3.11 / 3.12 / 3.13 — keep verbatim.
    name: pytest-matrix-on-ubuntu-py${{ matrix.python-version }}
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","Linux","X64","scitex-ci"]') }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      SCITEX_CI_APPTAINER: ${{ vars.SCITEX_CI_APPTAINER }}
      SCITEX_CI_SIF: ${{ vars.SCITEX_CI_SIF }}
      SCITEX_CI_SIF_SHA256: ${{ vars.SCITEX_CI_SIF_SHA256 }}
    steps:
      # fetch-depth: 0 is REQUIRED here, not an optimisation. setuptools-scm
      # derives the version from git tags; a shallow clone hides them, so the
      # local editable install resolves to `0.1.dev1+g<sha>`. Published
      # scitex-cards unconditionally requires `scitex-dev>=0.59.0`, which makes
      # that string unsatisfiable — every matrix leg then fails BEFORE a test
      # is collected, which reads as a test failure and is not one.
      # The quality-audit workflow already checks out with fetch-depth: 0 and
      # passes for exactly this reason; it is the control for this change.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run tests
        # The wrapper verifies the immutable image digest before execution.
        # The inner runner then verifies its Python/PostgreSQL capabilities and
        # owns one socket-only throwaway cluster for this matrix leg.
        run: bash .github/ci/exec-in-sif.sh run-in-sif.sh ${{ matrix.python-version }}
      - name: Upload coverage to Codecov
        if: always() && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        env:
          # Per-job isolated HOME so parallel matrix jobs don't race on the
          # codecov uploader's state under $HOME, and so the uploader's
          # internal `git` calls don't trip "dubious ownership" on the
          # shared checkout. Paired with disable_safe_directory below.
          HOME: ${{ runner.temp }}/codecov-home-${{ matrix.python-version }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false
          disable_safe_directory: true
