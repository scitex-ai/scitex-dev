name: tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 7 * * *"  # nightly 07:00 UTC
  workflow_dispatch:

# Runs on the self-hosted Spartan CPU runner (label: spartan-cpu).
# Design (operator directives 2026-06-16): fail-fast / fail-loud / NO silent
# fallbacks. The runner pre-stages the toolchain (python3.11/3.12/3.13, fd,
# uv) under $HOME; this workflow uses them directly — NO actions/setup-python
# download (it floods the HOME quota) and NO `sudo apt` (no sudo on Spartan).
# All heavy I/O (venv, caches, tmp) lives on punim0264 so HOME stays clean.
jobs:
  test:
    # Job name kept verbatim — these are the required status checks on develop.
    name: pytest-matrix-on-ubuntu-py${{ matrix.python-version }}
    runs-on: [self-hosted, Linux, X64, spartan-cpu]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      PUNIM: /data/gpfs/projects/punim0264/ywatanabe/ci
    steps:
      - uses: actions/checkout@v4

      - name: Resolve pre-staged toolchain (fail-loud; no setup-python, no sudo)
        run: |
          set -euo pipefail
          # Pre-staged tools live under $HOME (shared FS, visible on the compute node).
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$HOME/.env-3.11/bin:$PATH"
          PY="python${{ matrix.python-version }}"
          command -v "$PY" >/dev/null || { echo "FATAL: $PY is not on the runner — prestage missing"; exit 1; }
          command -v fd    >/dev/null || { echo "FATAL: fd is not on the runner — prestage missing"; exit 1; }
          command -v uv    >/dev/null || { echo "FATAL: uv is not on the runner — prestage missing"; exit 1; }
          echo "$($PY --version) | $(fd --version) | uv $(uv --version)"
          # Heavy I/O off HOME -> punim0264 (operator: home must stay clean).
          BASE="$PUNIM/run-${{ github.run_id }}-${{ matrix.python-version }}"
          mkdir -p "$BASE/tmp" "$BASE/uvcache"
          {
            echo "PATH=$PATH"
            echo "TMPDIR=$BASE/tmp"
            echo "UV_CACHE_DIR=$BASE/uvcache"
            echo "CI_BASE=$BASE"
          } >> "$GITHUB_ENV"

      - name: Install .[all,dev] (single step, fail-loud — no `|| fallback` chain)
        run: |
          set -euo pipefail
          uv venv --python "python${{ matrix.python-version }}" "$CI_BASE/venv"
          uv pip install --python "$CI_BASE/venv/bin/python" -e ".[all,dev]"

      - name: Run tests
        run: |
          set -euo pipefail
          "$CI_BASE/venv/bin/pytest" tests/ --cov=src/scitex_dev --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        if: always() && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false

      - name: Clean punim0264 scratch (keep disk tidy)
        if: always()
        run: rm -rf "${CI_BASE:-/nonexistent}" || true
