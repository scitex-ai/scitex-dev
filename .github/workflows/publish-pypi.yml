name: Publish to PyPI

# Opt-in: a `git push origin <v-tag>` does NOT trigger publishing.
# Run explicitly via:
#   gh workflow run publish-pypi.yml -f version=vX.Y.Z
# or in the GitHub UI: Actions → Publish to PyPI → Run workflow.
# The `version` input must be a tag that already exists on the repo;
# the build step checks it out so what is tagged is what ships.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag to publish (e.g. v0.10.19) — must already exist on the repo'
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/scitex-dev
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: pip install build
      - name: Build distribution
        run: python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
