name: import-smoke

# Catches "wheel installs but `import scitex_dev` blows up at runtime"
# — separate from the full pytest suite so a broken entry-point fails
# fast without paying for the matrix. Companion to `tests` — confirms
# the bare package (no extras) is `pip install -e .`-able and
# `import scitex_dev` succeeds. Catches `[project] dependencies`
# drift that the test matrix masks because it installs `[all,dev]`.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 17 * * *"  # nightly 17:00 UTC (~02:00 JST), off-peak
  workflow_dispatch:


jobs:
  full-original-import:
    uses: scitex-ai/.github/.github/workflows/import-smoke.yml@refs/heads/main
    with:
      dev_original_commands: true
      runs_on: '["self-hosted","Linux","X64","scitex-org-cpu"]'

  install-check:
    name: import-smoke-on-ubuntu-py3-12
    needs: full-original-import
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Propagate the full original validation result
        env:
          FULL_RESULT: ${{ needs.full-original-import.result }}
        run: |
          case "$FULL_RESULT" in
            success) ;;
            *) printf '%s\n' "Full original validation result: $FULL_RESULT" >&2; exit 1 ;;
          esac
