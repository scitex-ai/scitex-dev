name: import-smoke

# Catches "wheel installs but `import scitex_dev` blows up at runtime"
# — separate from the full pytest suite so a broken entry-point fails
# fast without paying for the matrix. Companion to `tests` — confirms
# the bare package (no extras) is `pip install -e .`-able and
# `import scitex_dev` succeeds. Catches `[project] dependencies`
# drift that the test matrix masks because it installs `[all,dev]`.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 17 * * *"  # nightly 17:00 UTC (~02:00 JST), off-peak
  workflow_dispatch:

jobs:
  # 2026-07-10 incident remediation: centralized as an org-level reusable
  # workflow at scitex-ai/.github (pilot: PR #69 on scitex-ai/scitex-stats).
  # Only this job body changes — on:/concurrency:/permissions: above stay
  # byte-identical to the pre-migration file.
  import-smoke:
    # New required-status-check context: "import-smoke / import-smoke-on-ubuntu-py3-12"
    uses: scitex-ai/.github/.github/workflows/import-smoke.yml@main
    secrets: inherit
