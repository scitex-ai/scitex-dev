name: auto-merge-to-develop
# Merge green PRs that TARGET develop, the moment their checks complete.
# GitHub reads check_suite-triggered workflows from the DEFAULT branch (main),
# so this file lives on main but acts ONLY on PRs whose base is develop.
# codecov + readthedocs checks are ignored (advisory). Fail-safe: if a merge
# is blocked by branch policy the PR simply stays open.
on:
  check_suite:
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  # 2026-07-10 incident remediation: centralized as an org-level reusable
  # workflow at scitex-ai/.github (pilot: PR #69 on scitex-ai/scitex-stats).
  # Only this job body changes — on:/permissions: above stay byte-identical
  # to the pre-migration file. This file must stay on the DEFAULT branch
  # (main) — GitHub reads check_suite-triggered workflows from there.
  call:
    uses: scitex-ai/.github/.github/workflows/auto-merge-to-develop.yml@main
    secrets: inherit
