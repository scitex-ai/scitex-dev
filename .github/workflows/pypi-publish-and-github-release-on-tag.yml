name: release

# Tag-driven release pipeline. The intended operator flow is:
#
#     git tag vX.Y.Z && git push origin vX.Y.Z
#
# Everything else fires automatically:
#
#   1. test          — matrix pytest. Must pass or the pipeline halts;
#                      nothing is published until tests are green on the
#                      tagged commit.
#   2. build         — wheel + sdist, uploaded as workflow artifact.
#   3. publish       — PyPI via OIDC trusted publisher.
#   4. release       — GitHub Release with CHANGELOG notes + artifacts.
#   5. sync-main     — open a develop→main PR (admin-merge) so main
#                      always equals the latest released commit. Skipped
#                      if main already matches.
#
# Manual re-run: the workflow also accepts a `version` input via
# workflow_dispatch so you can re-publish without re-tagging.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag to publish (e.g. v0.10.19) — must already exist on the repo'
        required: true
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            v="${GITHUB_REF#refs/tags/}"
          else
            v="${{ inputs.version }}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ver.outputs.version }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install fd (Rust file finder; preferred fast path for audit discovery)
        run: |
          # The audit-all conformance test exercises fd-backed file
          # discovery. fd is the preferred accelerator: when absent the
          # helper warns loudly and falls back to a stdlib walk (never a
          # silent fallback, never a hard crash). We install it here so CI
          # always runs the fast path. Debian/Ubuntu ships the binary as
          # `fdfind`, which the discovery helper accepts.
          sudo apt-get update && sudo apt-get install -y fd-find
          fdfind --version
      - name: Install (best-effort fallback chain)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]" || pip install -e ".[dev]" || pip install -e .
      - name: Run pytest
        run: |
          if [ -d tests ]; then
            pytest tests/ -x
          else
            echo "no tests/ directory — skipping pytest"
          fi

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            v="${GITHUB_REF#refs/tags/}"
          else
            v="${{ inputs.version }}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ver.outputs.version }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: pip install build
      - name: Build distribution
        run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/scitex-dev
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  release:
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.version }}
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Extract release notes from CHANGELOG.md
        # 2026-05-27: explicitly NEVER fail this step. The downstream
        # `gh release create` consumes `release-notes.md`; under
        # `bash -eo pipefail` (GHA default) any of these conditions
        # used to cascade into a failed `release` job even though PyPI
        # had already published successfully:
        #   - CHANGELOG.md missing entirely
        #   - awk syntax error / non-zero exit
        #   - `## [X.Y.Z]` section absent (extractor writes empty file,
        #     and downstream `gh release create --notes-file` rejects
        #     an empty file when the upstream step also errored)
        # The hardened script disables -e, guards every path, and
        # guarantees a non-empty release-notes.md before exiting 0.
        # See GH-Release wave 2026-05-27 (crossref-local 0.7.4 +
        # openalex-local 0.7.6 PyPI-OK / GH-Release missing).
        shell: bash
        run: |
          set +e
          VERSION="${{ needs.build.outputs.version }}"
          VERSION="${VERSION#v}"
          : > release-notes.md
          if [ -f CHANGELOG.md ]; then
            awk -v v="$VERSION" '
              $0 ~ "^## \\[" v "\\]" {p=1; next}
              p && /^## \[/ {exit}
              p
            ' CHANGELOG.md > release-notes.md 2>/dev/null
          fi
          if [ ! -s release-notes.md ]; then
            echo "Release v${VERSION}. See CHANGELOG.md for details." > release-notes.md
          fi
          exit 0
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ needs.build.outputs.version }}" \
            --title "${{ needs.build.outputs.version }}" \
            --notes-file release-notes.md \
            dist/*

  sync-main:
    # After a release tag is pushed, ensure `develop` exists and matches
    # `main`. The operator's release flow uses `develop → main` as the
    # release PR (head=develop, base=main), which interacts with the
    # repo's `delete_branch_on_merge: true` setting:
    #
    #   * develop is GONE — auto-deleted by GitHub when the release PR
    #     merged. Recreate it at main HEAD (which already contains the
    #     release commit). This was the 2026-05-29 v0.14.1 failure mode:
    #     the old job tried `actions/checkout@v4 ref: develop` and errored
    #     "A branch or tag with the name 'develop' could not be found".
    #   * develop EXISTS but is behind main — fast-forward it.
    #   * develop EXISTS and matches main — no-op.
    #
    # All done via the API (no checkout-dance + git-push contortions).
    # The checkout is rooted on `main` (always present) so the job can't
    # fail at the checkout step on a missing develop.
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Ensure develop == main (recreate or fast-forward)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          MAIN_SHA=$(git rev-parse main)
          echo "main is at ${MAIN_SHA}"
          if gh api "repos/${REPO}/branches/develop" >/tmp/dev.json 2>/dev/null; then
            DEV_SHA=$(jq -r '.commit.sha' /tmp/dev.json)
            if [ "${DEV_SHA}" = "${MAIN_SHA}" ]; then
              echo "develop already at main (${MAIN_SHA}); nothing to do."
              exit 0
            fi
            echo "develop=${DEV_SHA} != main=${MAIN_SHA}; fast-forwarding develop to main"
            gh api -X PATCH "repos/${REPO}/git/refs/heads/develop" \
              -f sha="${MAIN_SHA}" -F force=false
          else
            echo "develop branch missing (auto-deleted on release-PR merge?); recreating at main"
            gh api -X POST "repos/${REPO}/git/refs" \
              -f ref="refs/heads/develop" -f sha="${MAIN_SHA}"
          fi
