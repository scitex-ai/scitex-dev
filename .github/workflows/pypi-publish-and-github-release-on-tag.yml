name: release

# Tag push validates the immutable source and builds its whole distributions.
# Publication is a deliberate protected-main workflow_dispatch after normal
# main promotion and exact publisher selection in Organization Group6.
# PyPI retains this caller filename, pypi environment and manual OIDC flow.
# The central reusable workflow cannot impersonate that Trusted Publisher.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing promoted release tag (vX.Y.Z)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  runner-admission:
    uses: scitex-ai/.github/.github/workflows/runner-admission.yml@d7d96c34d68cdfbb5503a933591f7748b5aa30ee
    with:
      runs_on: '["self-hosted","Linux","X64","scitex-org-cpu"]'

  test-and-build:
    permissions:
      contents: read
      id-token: write
    uses: scitex-ai/.github/.github/workflows/ci-sif-matrix.yml@main
    with:
      suite: dev-release
      release_tag: ${{ inputs.version || '' }}
      runs_on: '["self-hosted","Linux","X64","scitex-org-cpu"]'

  publish:
    needs:
    - runner-admission
    - test-and-build
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ${{ fromJSON(needs.runner-admission.outputs.runs_on) }}
    timeout-minutes: 30
    environment:
      name: pypi
      url: https://pypi.org/p/scitex-dev
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ needs.test-and-build.outputs.release_tag }}
      RELEASE_COMMIT: ${{ needs.test-and-build.outputs.source_commit }}
    steps:
    - name: Validate declared Organization admission before checkout
      env:
        NATIVE_AUTHORIZED: ${{ needs.runner-admission.outputs.native_authorized }}
        RUNNER_ENVIRONMENT: ${{ runner.environment }}
        ADMISSION_REASON: ${{ needs.runner-admission.outputs.reason }}
        ADMISSION_RUNS_ON: ${{ needs.runner-admission.outputs.runs_on }}
      run: |
        set -eu
        case "$RUNNER_ENVIRONMENT" in
        self-hosted)
          test "$NATIVE_AUTHORIZED" = true
          test "$ADMISSION_REASON" = confirmed-organization-members
          test "$ADMISSION_RUNS_ON" = '{"group":"Organization","labels":["self-hosted","Linux","X64","scitex-org-cpu"]}'
          ;;
        github-hosted)
          ;;
        *)
          printf '%s\n' 'Unknown runner environment refused' >&2
          exit 1
          ;;
        esac
    - name: Require protected-main company release admission
      env:
        NATIVE_AUTHORIZED: ${{ needs.runner-admission.outputs.native_authorized }}
        RUNNER_ENVIRONMENT: ${{ runner.environment }}
      run: |
        set -euo pipefail
        test "$RUNNER_ENVIRONMENT" = self-hosted
        test "$NATIVE_AUTHORIZED" = true
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ needs.test-and-build.outputs.source_commit }}
        fetch-depth: 0
        persist-credentials: false
    - name: Require the immutable release checkout
      run: test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
    - name: Verify complete source/runtime/image release closure
      id: inputs
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
      env:
        PLAN: ${{ needs.test-and-build.outputs.release_plan }}
        NATIVE_CI_SIF: ${{ vars.SCITEX_CI_SIF }}
        NATIVE_PG_SIF: ''
      with:
        script: |
          // BEGIN SIF_FILE_GATE
          const fs = require('fs');
          const fsp = fs.promises;
          const path = require('path');
          const crypto = require('crypto');
          const plan = JSON.parse(process.env.PLAN);
          if (plan.profile !== 'dev' || plan.suite !== 'dev-release' || plan.native !== true)
            throw new Error('native-dev-release-plan-required');
          const deadline = Date.now() + 15 * 60 * 1000;
          function check(value, reason) { if (!value) throw new Error(reason); }
          function timeFence() { check(Date.now() < deadline, 'image-acquisition-deadline'); }
          async function regularBytes(file, expected, expectedSize = null) {
            timeFence();
            const handle = await fsp.open(file, fs.constants.O_RDONLY | fs.constants.O_NOFOLLOW);
            try {
              const before = await handle.stat();
              check(before.isFile() && (expectedSize === null || before.size === expectedSize), 'file-metadata-mismatch');
              const hash = crypto.createHash('sha256');
              const chunk = Buffer.alloc(1024 * 1024);
              let count = 0;
              while (true) {
                timeFence();
                const {bytesRead} = await handle.read(chunk, 0, chunk.length, null);
                if (!bytesRead) break;
                count += bytesRead;
                check(count <= before.size, 'file-size-changed');
                hash.update(chunk.subarray(0, bytesRead));
              }
              const after = await handle.stat();
              const current = await fsp.lstat(file);
              timeFence();
              check(after.dev === before.dev && after.ino === before.ino && after.size === before.size
                && after.mtimeMs === before.mtimeMs && after.ctimeMs === before.ctimeMs
                && current.dev === before.dev && current.ino === before.ino
                && count === before.size && hash.digest('hex') === expected, 'file-byte-pin-mismatch');
            } finally { await handle.close(); }
          }
          const workspace = path.resolve(process.env.GITHUB_WORKSPACE);
          for (const [relative, digest] of Object.entries(plan.leafSources)) {
            let current = workspace;
            check((await fsp.lstat(current)).isDirectory(), 'source-root-invalid');
            const parts = relative.split('/');
            for (const part of parts.slice(0, -1)) {
              current = path.join(current, part);
              const value = await fsp.lstat(current);
              check(value.isDirectory() && !value.isSymbolicLink(), 'source-parent-not-owned');
            }
            await regularBytes(path.join(workspace, relative), digest);
          }
          await regularBytes(plan.runtime.path, plan.runtime.sha256, plan.runtime.bytes);
          let owned = null;
          if (!plan.native) {
            const base = path.resolve(process.env.RUNNER_TEMP);
            check((await fsp.lstat(base)).isDirectory(), 'runner-scratch-invalid');
            owned = await fsp.mkdtemp(path.join(base, 'scitex-sif-'));
            await fsp.chmod(owned, 0o700);
            const value = await fsp.lstat(owned);
            core.setOutput('owned', JSON.stringify({root: owned, dev: value.dev, ino: value.ino, uid: value.uid}));
          }
          async function acquire(image, locator, name) {
            if (plan.native) {
              check(typeof locator === 'string' && path.isAbsolute(locator)
                && image.native_paths.includes(locator), 'native-image-locator-unapproved');
              const actual = await fsp.realpath(locator);
              await regularBytes(actual, image.sha256, image.bytes);
              return actual;
            }
            const target = path.join(owned, name);
            const output = await fsp.open(target, 'wx', 0o600);
            try {
              let location = image.delivery.url;
              let response;
              for (let redirects = 0; redirects <= 5; redirects++) {
                const url = new URL(location);
                check(url.protocol === 'https:' && !url.username && !url.password
                  && image.delivery.redirect_hosts.includes(url.hostname), 'public-image-redirect-refused');
                response = await fetch(url.href, {
                  redirect: 'manual', signal: AbortSignal.timeout(Math.max(1, deadline - Date.now())),
                });
                if (![301, 302, 303, 307, 308].includes(response.status)) break;
                const next = response.headers.get('location');
                check(next && redirects < 5, 'public-image-redirect-refused');
                location = new URL(next, url).href;
              }
              check(response.ok && response.body, 'public-image-download-refused');
              let count = 0;
              for await (const chunk of response.body) {
                timeFence();
                count += chunk.length;
                check(count <= image.bytes, 'public-image-size-exceeded');
                let offset = 0;
                while (offset < chunk.length) {
                  timeFence();
                  const {bytesWritten} = await output.write(chunk, offset, chunk.length - offset, null);
                  timeFence();
                  check(Number.isSafeInteger(bytesWritten) && bytesWritten > 0
                    && bytesWritten <= chunk.length - offset, 'public-image-write-stalled');
                  offset += bytesWritten;
                }
              }
              check(count === image.bytes, 'public-image-size-mismatch');
              await output.sync();
            } finally { await output.close(); }
            await regularBytes(target, image.sha256, image.bytes);
            await fsp.chmod(target, 0o400);
            return target;
          }
          core.setOutput('sif', await acquire(plan.image, process.env.NATIVE_CI_SIF, 'ci.sif'));
          core.setOutput('pg_sif', plan.pgImage
            ? await acquire(plan.pgImage, process.env.NATIVE_PG_SIF, 'pg.sif') : '');
          timeFence();
          core.setOutput('apptainer', plan.runtime.path);
          // END SIF_FILE_GATE
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: ${{ needs.test-and-build.outputs.artifact }}
        path: .
    - name: Verify the build job manifest byte pin
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
      env:
        MANIFEST_SHA256: ${{ needs.test-and-build.outputs.manifest_sha256 }}
      with:
        script: |
          const fs = require('fs');
          const crypto = require('crypto');
          const expected = process.env.MANIFEST_SHA256;
          if (!/^[a-f0-9]{64}$/.test(expected || '')) throw new Error('manifest-pin-required');
          const fd = fs.openSync('release-manifest.json', fs.constants.O_RDONLY | fs.constants.O_NOFOLLOW);
          try {
            const before = fs.fstatSync(fd, {bigint: true});
            if (!before.isFile() || before.size > 1048576n) throw new Error('manifest-kind-or-size-refused');
            const body = fs.readFileSync(fd);
            const after = fs.fstatSync(fd, {bigint: true});
            const current = fs.lstatSync('release-manifest.json', {bigint: true});
            for (const field of ['dev', 'ino', 'mode', 'size', 'mtimeNs', 'ctimeNs']) {
              if (before[field] !== after[field] || after[field] !== current[field]) throw new Error('manifest-changed');
            }
            if (crypto.createHash('sha256').update(body).digest('hex') !== expected) throw new Error('manifest-byte-pin-mismatch');
          } finally { fs.closeSync(fd); }
    - name: Verify complete wheel/sdist identity and RECORD before publishing
      env:
        SCITEX_CI_SIF: ${{ steps.inputs.outputs.sif }}
        SCITEX_CI_APPTAINER: ${{ steps.inputs.outputs.apptainer }}
      run: |
        set -euo pipefail
        "$SCITEX_CI_APPTAINER" exec --cleanenv --no-home --pwd "$PWD" --bind "$PWD:$PWD" "$SCITEX_CI_SIF" /opt/venv-3.12/bin/python -I -B .github/ci/release-identity.py verify --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT"
    - name: Publish via the original manual PyPI OIDC SIF publisher
      env:
        SCITEX_CI_SIF: ${{ steps.inputs.outputs.sif }}
        SCITEX_CI_SIF_SHA256: ${{ fromJSON(needs.test-and-build.outputs.release_plan).image.sha256 }}
        SCITEX_CI_APPTAINER: ${{ steps.inputs.outputs.apptainer }}
      run: bash .github/ci/exec-in-sif.sh publish-in-sif.sh 3.12
  release:
    needs:
    - runner-admission
    - test-and-build
    - publish
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ${{ fromJSON(needs.runner-admission.outputs.runs_on) }}
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.test-and-build.outputs.release_tag }}
      RELEASE_COMMIT: ${{ needs.test-and-build.outputs.source_commit }}
    steps:
    - name: Validate declared Organization admission before checkout
      env:
        NATIVE_AUTHORIZED: ${{ needs.runner-admission.outputs.native_authorized }}
        RUNNER_ENVIRONMENT: ${{ runner.environment }}
        ADMISSION_REASON: ${{ needs.runner-admission.outputs.reason }}
        ADMISSION_RUNS_ON: ${{ needs.runner-admission.outputs.runs_on }}
      run: |
        set -eu
        case "$RUNNER_ENVIRONMENT" in
        self-hosted)
          test "$NATIVE_AUTHORIZED" = true
          test "$ADMISSION_REASON" = confirmed-organization-members
          test "$ADMISSION_RUNS_ON" = '{"group":"Organization","labels":["self-hosted","Linux","X64","scitex-org-cpu"]}'
          ;;
        github-hosted)
          ;;
        *)
          printf '%s\n' 'Unknown runner environment refused' >&2
          exit 1
          ;;
        esac
    - name: Require protected-main company release admission
      env:
        NATIVE_AUTHORIZED: ${{ needs.runner-admission.outputs.native_authorized }}
        RUNNER_ENVIRONMENT: ${{ runner.environment }}
      run: |
        set -euo pipefail
        test "$RUNNER_ENVIRONMENT" = self-hosted
        test "$NATIVE_AUTHORIZED" = true
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ needs.test-and-build.outputs.source_commit }}
        fetch-depth: 0
        persist-credentials: false
    - name: Require the immutable release checkout
      run: test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
    - name: Verify complete source/runtime/image release closure
      id: inputs
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
      env:
        PLAN: ${{ needs.test-and-build.outputs.release_plan }}
        NATIVE_CI_SIF: ${{ vars.SCITEX_CI_SIF }}
        NATIVE_PG_SIF: ''
      with:
        script: |
          // BEGIN SIF_FILE_GATE
          const fs = require('fs');
          const fsp = fs.promises;
          const path = require('path');
          const crypto = require('crypto');
          const plan = JSON.parse(process.env.PLAN);
          if (plan.profile !== 'dev' || plan.suite !== 'dev-release' || plan.native !== true)
            throw new Error('native-dev-release-plan-required');
          const deadline = Date.now() + 15 * 60 * 1000;
          function check(value, reason) { if (!value) throw new Error(reason); }
          function timeFence() { check(Date.now() < deadline, 'image-acquisition-deadline'); }
          async function regularBytes(file, expected, expectedSize = null) {
            timeFence();
            const handle = await fsp.open(file, fs.constants.O_RDONLY | fs.constants.O_NOFOLLOW);
            try {
              const before = await handle.stat();
              check(before.isFile() && (expectedSize === null || before.size === expectedSize), 'file-metadata-mismatch');
              const hash = crypto.createHash('sha256');
              const chunk = Buffer.alloc(1024 * 1024);
              let count = 0;
              while (true) {
                timeFence();
                const {bytesRead} = await handle.read(chunk, 0, chunk.length, null);
                if (!bytesRead) break;
                count += bytesRead;
                check(count <= before.size, 'file-size-changed');
                hash.update(chunk.subarray(0, bytesRead));
              }
              const after = await handle.stat();
              const current = await fsp.lstat(file);
              timeFence();
              check(after.dev === before.dev && after.ino === before.ino && after.size === before.size
                && after.mtimeMs === before.mtimeMs && after.ctimeMs === before.ctimeMs
                && current.dev === before.dev && current.ino === before.ino
                && count === before.size && hash.digest('hex') === expected, 'file-byte-pin-mismatch');
            } finally { await handle.close(); }
          }
          const workspace = path.resolve(process.env.GITHUB_WORKSPACE);
          for (const [relative, digest] of Object.entries(plan.leafSources)) {
            let current = workspace;
            check((await fsp.lstat(current)).isDirectory(), 'source-root-invalid');
            const parts = relative.split('/');
            for (const part of parts.slice(0, -1)) {
              current = path.join(current, part);
              const value = await fsp.lstat(current);
              check(value.isDirectory() && !value.isSymbolicLink(), 'source-parent-not-owned');
            }
            await regularBytes(path.join(workspace, relative), digest);
          }
          await regularBytes(plan.runtime.path, plan.runtime.sha256, plan.runtime.bytes);
          let owned = null;
          if (!plan.native) {
            const base = path.resolve(process.env.RUNNER_TEMP);
            check((await fsp.lstat(base)).isDirectory(), 'runner-scratch-invalid');
            owned = await fsp.mkdtemp(path.join(base, 'scitex-sif-'));
            await fsp.chmod(owned, 0o700);
            const value = await fsp.lstat(owned);
            core.setOutput('owned', JSON.stringify({root: owned, dev: value.dev, ino: value.ino, uid: value.uid}));
          }
          async function acquire(image, locator, name) {
            if (plan.native) {
              check(typeof locator === 'string' && path.isAbsolute(locator)
                && image.native_paths.includes(locator), 'native-image-locator-unapproved');
              const actual = await fsp.realpath(locator);
              await regularBytes(actual, image.sha256, image.bytes);
              return actual;
            }
            const target = path.join(owned, name);
            const output = await fsp.open(target, 'wx', 0o600);
            try {
              let location = image.delivery.url;
              let response;
              for (let redirects = 0; redirects <= 5; redirects++) {
                const url = new URL(location);
                check(url.protocol === 'https:' && !url.username && !url.password
                  && image.delivery.redirect_hosts.includes(url.hostname), 'public-image-redirect-refused');
                response = await fetch(url.href, {
                  redirect: 'manual', signal: AbortSignal.timeout(Math.max(1, deadline - Date.now())),
                });
                if (![301, 302, 303, 307, 308].includes(response.status)) break;
                const next = response.headers.get('location');
                check(next && redirects < 5, 'public-image-redirect-refused');
                location = new URL(next, url).href;
              }
              check(response.ok && response.body, 'public-image-download-refused');
              let count = 0;
              for await (const chunk of response.body) {
                timeFence();
                count += chunk.length;
                check(count <= image.bytes, 'public-image-size-exceeded');
                let offset = 0;
                while (offset < chunk.length) {
                  timeFence();
                  const {bytesWritten} = await output.write(chunk, offset, chunk.length - offset, null);
                  timeFence();
                  check(Number.isSafeInteger(bytesWritten) && bytesWritten > 0
                    && bytesWritten <= chunk.length - offset, 'public-image-write-stalled');
                  offset += bytesWritten;
                }
              }
              check(count === image.bytes, 'public-image-size-mismatch');
              await output.sync();
            } finally { await output.close(); }
            await regularBytes(target, image.sha256, image.bytes);
            await fsp.chmod(target, 0o400);
            return target;
          }
          core.setOutput('sif', await acquire(plan.image, process.env.NATIVE_CI_SIF, 'ci.sif'));
