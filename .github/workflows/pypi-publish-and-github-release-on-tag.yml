name: release

# Tag-driven release pipeline. The intended operator flow is:
#
#     git tag vX.Y.Z && git push origin vX.Y.Z
#
# Everything else fires automatically:
#
#   1. test          — matrix pytest. Must pass or the pipeline halts;
#                      nothing is published until tests are green on the
#                      tagged commit.
#   2. build         — wheel + sdist, uploaded as workflow artifact.
#   3. publish       — PyPI via OIDC trusted publisher.
#   4. release       — GitHub Release with CHANGELOG notes + artifacts.
#   5. sync-main     — open a develop→main PR (admin-merge) so main
#                      always equals the latest released commit. Skipped
#                      if main already matches.
#
# Manual re-run: the workflow also accepts a `version` input via
# workflow_dispatch so you can re-publish without re-tagging.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag to publish (e.g. v0.10.19) — must already exist on the repo'
        required: true
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            v="${GITHUB_REF#refs/tags/}"
          else
            v="${{ inputs.version }}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ver.outputs.version }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install fd (Rust file finder; preferred fast path for audit discovery)
        run: |
          # The audit-all conformance test exercises fd-backed file
          # discovery. fd is the preferred accelerator: when absent the
          # helper warns loudly and falls back to a stdlib walk (never a
          # silent fallback, never a hard crash). We install it here so CI
          # always runs the fast path. Debian/Ubuntu ships the binary as
          # `fdfind`, which the discovery helper accepts.
          sudo apt-get update && sudo apt-get install -y fd-find
          fdfind --version
      - name: Install (best-effort fallback chain)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]" || pip install -e ".[dev]" || pip install -e .
      - name: Run pytest
        run: |
          if [ -d tests ]; then
            pytest tests/ -x
          else
            echo "no tests/ directory — skipping pytest"
          fi

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            v="${GITHUB_REF#refs/tags/}"
          else
            v="${{ inputs.version }}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ver.outputs.version }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: pip install build
      - name: Build distribution
        run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/scitex-dev
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  release:
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.version }}
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Extract release notes from CHANGELOG.md
        # 2026-05-27: explicitly NEVER fail this step. The downstream
        # `gh release create` consumes `release-notes.md`; under
        # `bash -eo pipefail` (GHA default) any of these conditions
        # used to cascade into a failed `release` job even though PyPI
        # had already published successfully:
        #   - CHANGELOG.md missing entirely
        #   - awk syntax error / non-zero exit
        #   - `## [X.Y.Z]` section absent (extractor writes empty file,
        #     and downstream `gh release create --notes-file` rejects
        #     an empty file when the upstream step also errored)
        # The hardened script disables -e, guards every path, and
        # guarantees a non-empty release-notes.md before exiting 0.
        # See GH-Release wave 2026-05-27 (crossref-local 0.7.4 +
        # openalex-local 0.7.6 PyPI-OK / GH-Release missing).
        shell: bash
        run: |
          set +e
          VERSION="${{ needs.build.outputs.version }}"
          VERSION="${VERSION#v}"
          : > release-notes.md
          if [ -f CHANGELOG.md ]; then
            awk -v v="$VERSION" '
              $0 ~ "^## \\[" v "\\]" {p=1; next}
              p && /^## \[/ {exit}
              p
            ' CHANGELOG.md > release-notes.md 2>/dev/null
          fi
          if [ ! -s release-notes.md ]; then
            echo "Release v${VERSION}. See CHANGELOG.md for details." > release-notes.md
          fi
          exit 0
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ needs.build.outputs.version }}" \
            --title "${{ needs.build.outputs.version }}" \
            --notes-file release-notes.md \
            dist/*

  sync-main:
    # After a release tag is pushed (which lives on develop), advance
    # `main` to the tagged commit so `main` reliably tracks "last
    # released SHA". The operator's actual release flow is:
    #
    #     git tag vX.Y.Z develop && git push origin vX.Y.Z
    #
    # i.e. the tag lives on develop's tip and develop is ahead of main
    # by every commit since the previous release. The PRIOR sync-main
    # logic tried to fast-forward develop TO main's SHA, which is
    # backwards for this flow: develop has commits main doesn't, so
    # `PATCH refs/heads/develop -f sha=MAIN_SHA -F force=false` failed
    # with "Update is not a fast forward" (HTTP 422) on every release
    # (v0.16.1 / v0.17.0 / v0.17.1 / v0.17.2 / v0.17.3). That failure
    # was benign — publish + GitHub Release jobs already succeeded —
    # but surfaced as a red workflow on every release and confused
    # every reader of the CI dashboard.
    #
    # New logic (closes #105):
    #   * tag_sha == main → no-op (already in sync, re-run of dispatch).
    #   * tag_sha is a descendant of main (typical case) → ff main → tag.
    #   * tag_sha is NOT a descendant of main → surface and exit non-zero
    #     (rare; means main has commits the tag doesn't, e.g. a hotfix
    #     landed on main without going through develop). Human handles.
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Resolve tag SHA (checkout-free)
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            tag="${{ inputs.version }}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          ref_sha=$(gh api "repos/${REPO}/git/refs/tags/${tag}" --jq '.object.sha')
          # Annotated tags resolve to a tag object; peel to the commit.
          obj_type=$(gh api "repos/${REPO}/git/refs/tags/${tag}" --jq '.object.type')
          if [ "${obj_type}" = "tag" ]; then
            tag_sha=$(gh api "repos/${REPO}/git/tags/${ref_sha}" --jq '.object.sha')
          else
            tag_sha="${ref_sha}"
          fi
          echo "tag_sha=${tag_sha}" >> "$GITHUB_OUTPUT"
      - name: Advance main to the tagged commit (or no-op)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.ver.outputs.tag }}
          TAG_SHA: ${{ steps.ver.outputs.tag_sha }}
        run: |
          set -euo pipefail
          main_sha=$(gh api "repos/${REPO}/branches/main" --jq '.commit.sha')
          echo "tag ${TAG} = ${TAG_SHA}"
          echo "main      = ${main_sha}"
          if [ "${TAG_SHA}" = "${main_sha}" ]; then
            echo "main already at ${TAG}; nothing to do."
            exit 0
          fi
          # Strict fast-forward (force=false). If main has commits the
          # tag doesn't, this fails with HTTP 422 — the human-handled
          # path (rare; hotfix landed on main outside the develop flow).
          if gh api -X PATCH "repos/${REPO}/git/refs/heads/main" \
              -f sha="${TAG_SHA}" -F force=false; then
            echo "main fast-forwarded to ${TAG}."
          else
            echo "::error::main is not a descendant of ${TAG}; manual reconcile required." >&2
            echo "::error::Likely a hotfix landed on main outside the develop flow." >&2
            exit 1
          fi
