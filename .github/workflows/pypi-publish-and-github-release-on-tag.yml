name: release

# Tag-driven release pipeline — SELF-HOSTED (Spartan CPU) via the scitex-ci SIF.
#
# The intended operator flow is:
#
#     git tag vX.Y.Z && git push origin vX.Y.Z
#
# Everything else fires automatically:
#
#   1. test          — matrix pytest INSIDE the SIF. Must pass or the pipeline
#                      halts; nothing is published until tests are green on the
#                      tagged commit.
#   2. build         — wheel + sdist built INSIDE the SIF, uploaded as artifact.
#   3. publish       — PyPI via MANUAL OIDC trusted publishing INSIDE the SIF.
#   4. release       — GitHub Release with CHANGELOG notes + artifacts.
#
# develop→main promotion is a DELIBERATE, separate PR (operator policy);
# this pipeline never auto-syncs main.
#
# WHY the SIF (operator standardization 2026-06-18, fleet canary 2026-06-21):
# the Spartan compute runners have NO Python on the bare node, so the old
# `actions/setup-python@v5` step failed at init ("version 3.x not found for
# this OS"). The working pytest-matrix CI runs INSIDE the pre-built, reused
# scitex-ci SIF (`apptainer exec ci-cpu.sif`), which bakes python 3.11/3.12/
# 3.13 + pip + uv + fd at /opt/venv-<ver>. This release pipeline mirrors that:
#   - test/build run `bash .github/ci/exec-in-sif.sh <inner>.sh <pyver>`.
#   - publish CANNOT use pypa/gh-action-pypi-publish (a Docker action; the
#     compute nodes have no Docker), so it does MANUAL OIDC trusted publishing
#     inside the SIF (.github/ci/publish-in-sif.sh): GitHub OIDC JWT →
#     PyPI mint-token → twine upload. Trust config on PyPI is unchanged.
#   - actions/checkout, upload/download-artifact, codecov are JS actions and
#     run fine on the self-hosted runner.
# fail-loud: a missing SIF/shim/interpreter is a HARD error, never a
# bare-runner fallback.
#
# runs-on driven by repo Actions Variable CI_RUNS_ON; SIF + apptainer paths
# come from SCITEX_CI_SIF / SCITEX_CI_APPTAINER (same as pytest-matrix).
#
# Manual re-run: the workflow also accepts a `version` input via
# workflow_dispatch so you can re-publish without re-tagging.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag to publish (e.g. v0.10.19) — must already exist on the repo'
        required: true
        type: string

env:
  SCITEX_CI_APPTAINER: ${{ vars.SCITEX_CI_APPTAINER }}
  SCITEX_CI_SIF: ${{ vars.SCITEX_CI_SIF }}

jobs:
  test:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","Linux","X64","scitex-ci"]') }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            v="${GITHUB_REF#refs/tags/}"
          else
            v="${{ inputs.version }}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ver.outputs.version }}
          fetch-depth: 0
      # SIF-based self-hosted test run. No setup-python (the bare Spartan node
      # has no Python tool cache; that step failed "version not found for this
      # OS"); no apt fd-install (fd is baked in the SIF). exec-in-sif.sh
      # apptainer-execs the reused ci-cpu.sif and run-in-sif.sh layers THIS
      # (tagged) checkout + [all,dev] into a writable target, then runs pytest.
      # fail-loud on a missing SIF/shim.
      #
      # This job runs pytest INSIDE the SIF; pytest-matrix runs it on the bare
      # runner. So it does not "mirror pytest-matrix exactly", and the comment
      # that said so is why the env below was never copied across.
      - name: Run tests in the reused CI SIF (apptainer exec — deps layered, not on the bare runner)
          # WITHOUT THIS THE RELEASE CANNOT PUBLISH. v0.57.0 was tagged, and
          # every test leg failed with 32 errors — `RuntimeError: No writable
          # PostgreSQL is available for tests`, naming all three routes it
          # tried: SCITEX_STORE_DSN unset, this host's 55432 unreachable from
          # the container, and no initdb/pg_ctl to start a throwaway cluster.
          # build/publish/release then skipped on `needs: test`, so the tag
          # produced no artifact at all and PyPI stayed on the previous version.
          #
          # pytest-matrix has carried this line since the store suite landed.
          # This workflow never got it, and nothing caught that, because a
          # green PR gate here proves nothing about the tag pipeline — they are
          # different files running pytest by different routes.
          #
          # THE THIRD ROUTE IS NOW AVAILABLE, so no DSN is set here any more.
          #
          # The comment above describes the state that made pointing at the
          # primary necessary: "no initdb/pg_ctl to start a throwaway cluster".
          # That is fixed. The ci-cpu image now ships the PostgreSQL server, so
          # `writable_dsn()` falls through to `ephemeral_cluster_dsn()` — initdb
          # + pg_ctl on a unix socket in a temp dir, trust auth, torn down at
          # session end.
          #
          # WHY IT HAD TO CHANGE. On 2026-08-30 this very job failed on tag
          # v0.58.0, not from a defect but from connection exhaustion on the
          # shared primary (max_connections=100, ~24 in use at idle):
          #     FATAL: remaining connection slots are reserved for roles with
          #            the SUPERUSER attribute
          #     FATAL: sorry, too many clients already
          # 9 problems out of 7432 tests, all refusals; build/publish/release
          # skipped on `needs: test`; the tag produced no artifact and PyPI
          # stayed on the previous version — the exact outcome the comment above
          # was written about, arrived at by a different route. Re-running the
          # failed leg ALONE still reproduced it, so it is not a flake.
          #
          # And the blast radius was never limited to CI: while this job
          # saturated the primary, every agent's card write competed for the
          # same 100 slots. A test suite must not be able to deny service to the
          # production board, which is why the fix is isolation rather than a
          # bigger ceiling.
          #
          # PREREQUISITE, VERIFIED BEFORE THIS LANDED: every runner in the
          # `scitex-org-cpu` pool (compute-01..04, the pool CI_RUNS_ON names)
          # carries the rebuilt image — `initdb (PostgreSQL) 16.15` present in
          # the new one, absent in the old. Recipe:
          # src/scitex_dev/ci/runner/containers/ci-cpu.def
          #
          # ONE CLUSTER PER LEG, not one per worker. The store conftest binds
          # `writable_dsn()` at MODULE SCOPE and every xdist worker is a separate
          # process, so leaving the DSN unset makes each worker start its own
          # cluster during collection. pytest-matrix measured what that costs on
          # this pool — up to 36 concurrent initdb+pg_ctl on a 12-core box, which
          # do not fail but QUEUE until a 120 s guard fires. Same reasoning and
          # the same fix in both workflows.
        run: |
          set -euo pipefail
          PGBIN=$(dirname "$(ls /usr/lib/postgresql/*/bin/initdb | head -1)")
          PGDIR=$(mktemp -d "${RUNNER_TEMP:-/tmp}/pgrel-${{ matrix.python-version }}.XXXXXX")
          cleanup() {
            "$PGBIN/pg_ctl" -D "$PGDIR/data" -m immediate stop >/dev/null 2>&1 || true
            rm -rf "$PGDIR"
          }
          trap cleanup EXIT
          "$PGBIN/initdb" -D "$PGDIR/data" -A trust --encoding=UTF8 -U postgres >"$PGDIR/initdb.log" 2>&1
          "$PGBIN/pg_ctl" -D "$PGDIR/data" -o "-k $PGDIR -h ''" -w -t 60 start >"$PGDIR/start.log" 2>&1 \
            || { echo "::error::throwaway cluster failed to start"; tail -20 "$PGDIR/start.log"; exit 1; }
          # Started on the HOST, reached from inside the SIF over its unix
          # socket. exec-in-sif.sh passes no --cleanenv so the variable is
          # inherited, and $RUNNER_TEMP lives under $HOME, which apptainer binds
          # — the same reasoning the removed DSN comment relied on for ~/.pgpass.
          # If the socket turns out NOT to be reachable inside the container,
          # that is what this run will show, and the fix is a bind, not a return
          # to the fleet primary.
          # SOCKET DIRECTORY IN THE AUTHORITY, PERCENT-ENCODED — NOT `?host=`.
          # The test harness APPENDS its own query string to whatever this
          # names (`?options=-csearch_path=<per-test schema>`). A DSN that
          # already carries `?host=...` then yields TWO `?` and libpq refuses
          # the whole thing:
          #     extra key/value separator "=" in URI query parameter: "host"
          # Encoding the socket dir into the host position leaves the query
          # string free for the harness, which is the only place it can go.
          PGHOST_ENC=$(printf '%s' "$PGDIR" | sed 's|/|%2F|g')
          export SCITEX_STORE_DSN="postgresql://postgres@${PGHOST_ENC}/postgres"
          bash .github/ci/exec-in-sif.sh run-in-sif.sh ${{ matrix.python-version }}

  build:
    needs: test
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","Linux","X64","scitex-ci"]') }}
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            v="${GITHUB_REF#refs/tags/}"
          else
            v="${{ inputs.version }}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ver.outputs.version }}
          fetch-depth: 0
      # Build INSIDE the SIF (no setup-python on the bare Spartan node).
      # build-in-sif.sh installs the `build` frontend into a writable --target
      # inside the SIF, then `python -m build` → dist/. fail-loud on empty dist.
      - name: Build wheel + sdist in the CI SIF (apptainer exec)
        run: bash .github/ci/exec-in-sif.sh build-in-sif.sh 3.12
      # upload-artifact is a JS action — runs fine on the self-hosted runner.
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","Linux","X64","scitex-ci"]') }}
    environment:
      name: pypi
      url: https://pypi.org/p/scitex-dev
    # id-token: write is what populates ACTIONS_ID_TOKEN_REQUEST_{TOKEN,URL},
    # which publish-in-sif.sh uses to mint the OIDC JWT. Keep it.
    permissions:
      id-token: write
    steps:
      # Need the repo checked out so .github/ci/exec-in-sif.sh +
      # publish-in-sif.sh are on disk (the build job uploaded only dist/).
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      # Manual OIDC trusted publishing INSIDE the SIF — pypa/gh-action-pypi-
      # publish is a Docker action and the Spartan compute nodes have no Docker.
      # publish-in-sif.sh: GitHub OIDC JWT (audience=pypi) → PyPI mint-token →
      # twine upload dist/*. apptainer exec (no --cleanenv) passes the
      # ACTIONS_ID_TOKEN_REQUEST_* env vars into the SIF. fail-loud at each step.
      - name: Publish to PyPI via manual OIDC trusted publishing in the SIF
        run: bash .github/ci/exec-in-sif.sh publish-in-sif.sh 3.12

  release:
    needs: [build, publish]
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","Linux","X64","scitex-ci"]') }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.version }}
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          VERSION="${VERSION#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {p=1; next}
            p && /^## \[/ {exit}
            p
          ' CHANGELOG.md > release-notes.md || true
          if [ ! -s release-notes.md ]; then
            echo "Release v${VERSION}. See CHANGELOG.md for details." > release-notes.md
          fi
      # JS action that talks to the GitHub Releases API directly. The bare
      # Spartan self-hosted runner has NO `gh` CLI, so the old `gh release
      # create` failed with `gh: command not found` (exit 127) AFTER publish --
      # PyPI shipped but no Release page. JS actions run fine on the self-hosted
      # runner (same class as actions/checkout + upload-artifact), so this is the
      # fail-loud-safe equivalent: CHANGELOG notes + dist/* assets, no `gh` dep.
      # Needs the job's `permissions: contents: write` (already set); the action
      # uses ${{ github.token }} by default.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.version }}
          name: ${{ needs.build.outputs.version }}
          body_path: release-notes.md
          files: dist/*
          fail_on_unmatched_files: true
