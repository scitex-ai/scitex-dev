name: CLA Assistant

# Two trigger paths:
#   1. PRs from contributors           → CLAssistant action checks signature.
#                                         allowlist already short-circuits to
#                                         success for `bot*` and the repo
#                                         owner, so owner PRs land instantly.
#   2. Direct pushes / tag pushes      → owner-bypass job posts a synthetic
#      by the repo owner                  `CLAssistant=success` status on the
#                                         SHA so the release pipeline's
#                                         sync-main step (a direct ref PATCH)
#                                         doesn't get rejected by main's
#                                         branch-protection rule that requires
#                                         CLAssistant. Operator-direct: 2026-06-04.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]
  push:
    branches: [main, develop]
    tags: ['v*']

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  # 2026-07-10 incident remediation: centralized as an org-level reusable
  # workflow at scitex-ai/.github (pilot: PR #69 on scitex-ai/scitex-stats).
  # The reusable already contains both the owner-bypass job (direct-push CLA
  # status synth, operator-direct 2026-06-04) and the CLAssistant job, so the
  # whole jobs: block collapses to one caller. owner_allowlist is overridden
  # because this repo's allowlist ("bot*,ywatanabe1989,LLEmacs") differs from
  # the reusable's default ("bot*,ywatanabe1989"); default_branch (main) and
  # owner_login (ywatanabe1989) already match the reusable's defaults.
  call:
    uses: scitex-ai/.github/.github/workflows/cla.yml@main
    with:
      owner_allowlist: "bot*,ywatanabe1989,LLEmacs"
    secrets: inherit
