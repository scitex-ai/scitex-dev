name: CLA Assistant

# Org-level reusable-workflow caller (scitex-ai/.github, fleet standard).
#
# This file used to inline both CLA jobs. It now delegates to the org reusable,
# the way scitex-storage and the rest of the fleet already do. Three things
# improve at once, which is why this shape was chosen over patching the inline
# version:
#
#   1. EXECUTION MOVES TO ORG-OWNED CODE. The inline version called
#      `contributor-assistant/github-action` — an UPSTREAM third party — at the
#      MUTABLE tag `v2.6.1`. The reusable calls the org-owned fork
#      `scitex-ai/github-action@114064ad` at a fixed SHA. scitex-dev was worse
#      than the fleet standard here, not representative of it.
#   2. NO RUNNER IS NAMED IN THIS REPO. The destination lives in the callee, on
#      the org pool. Nothing here to drift, and no hosted-runner question to
#      answer in this file.
#   3. ONE PLACE TO FIX. A CLA change lands once in the org reusable instead of
#      being re-patched across every repo that inlined it.
#
# WHY THE `uses:` REF IS A SHA, NOT `@main`
# ------------------------------------------
# Most callers (including scitex-storage) use `@main`. A mutable org-level ref
# means a single change to the reusable lands in EVERY calling repo at once,
# with no review in any of them — and this workflow runs on `pull_request_target`
# and `issue_comment`, which unauthenticated strangers can fire on a PUBLIC repo,
# holding a write token and `GH_PERSONAL_ACCESS_TOKEN`. That is precisely where an
# unreviewed simultaneous fleet-wide change is least acceptable, so this caller
# pins the SHA and takes reusable updates deliberately.
#
# The 2026-07-29 bump to `ecb0345b` is one such deliberate update: the reusable
# now DECLARES `workflow_call.secrets`, which is what makes the explicit
# `secrets:` mapping below possible. Passing a named secret to a callee that
# does not declare it is an error, so the SHA bump and the narrowing are one
# change, not two.
#
# WHY THE `secrets:` MAPPING IS EXPLICIT, NOT `inherit`
# -----------------------------------------------------
# `secrets: inherit` forwards EVERY secret this repo holds. Measured
# 2026-07-29, that was two: the CLA-storage PAT the callee actually reads, and
# `CLAUDE_CODE_CREDENTIALS_JSON` — the fleet Claude credential, which the CLA
# workflow has no use for. Naming the one secret the callee declares drops the
# other from an attacker-startable job entirely.
#
# WHAT THIS DOES NOT FIX
# ----------------------
# RESOLVED BY THE 2026-08-30 BUMP TO `8da375a9`, and left here because the
# paragraph it replaces was the accurate description of a real exposure for a
# month. It read: "The callee still runs on persistent shared self-hosted
# runners, so CLA code still executes adjacent to fleet credentials." That was
# true at `ecb0345b`, where both callee jobs hard-coded
# `runs-on: [self-hosted, Linux, X64, spartan-cpu]` with no input to override.
# Upstream commit 57e2e772 gave the callee a `runs_on` input defaulting to
# '["ubuntu-latest"]', so this caller — which passes no runs_on — now lands on
# a disposable hosted VM and the credential adjacency is gone for this job.
# The general rule (a dedicated credential-free ephemeral pool for everything
# else) is still tracked separately.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]
  push:
    branches: [main, develop]
    tags: ['v*']

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  call:
    uses: scitex-ai/.github/.github/workflows/cla.yml@f5d19f5b7424fcf985137bb6acff54f5d0e11749 # main@2026-08-30
    # NON-DEFAULT ON PURPOSE. The reusable defaults to `bot*,ywatanabe1989`;
    # this repo's inline version also allowlisted `LLEmacs`. Taking the default
    # would silently start demanding a CLA signature from an already-allowlisted
    # contributor, so the third entry is carried over explicitly.
    #
    # `default_branch` (main) and `owner_login` (ywatanabe1989) already match
    # this repo's previous inline values, so they are left at their defaults.
    with:
      owner_allowlist: "bot*,ywatanabe1989,LLEmacs"
    # The ONE secret the callee declares. GITHUB_TOKEN is provided to called
    # workflows automatically and must NOT be listed here.
    secrets:
      GH_PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
