name: quality

# Single-package quality gate -- runs `scitex-dev ecosystem audit-all`
# against THIS package (audit-cli / audit-mcp-tools / audit-skills /
# audit-python-apis / audit-project). Mirrors the canonical audit that
# `tests/develop/test_audit.py` runs inside the test suite, but as a
# standalone gate so an audit regression is visible even when the matrix
# is skipped.
#
# scitex-dev IS the audit tool: it audits ITSELF using its OWN editable
# checkout, NOT a separately-pinned published scitex-dev. That way the
# gate exercises the auditor code on this very PR/commit -- a fix to the
# auditor is validated against itself before it ever ships.

on:
  schedule:
    - cron: "0 18 * * *"  # 18:00 UTC (~03:00 JST), after Test
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/scitex-dev-quality-audit-on-ubuntu-latest.yml"
  pull_request:
    branches: [main, develop]

jobs:
  audit:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","Linux","X64","scitex-ci"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create per-job venv (self-hosted shared-cache isolation)
        # Self-hosted runners share one read-only tool-cache + home, so
        # pip-installing into the base interpreter is blocked (PEP 668) and
        # would race across repos. A per-job venv on the runner's local
        # $RUNNER_TEMP isolates deps; GITHUB_PATH makes later steps use it.
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Ensure fd (Rust file finder; audit file discovery requires it)
        # OS-tolerant: use a preinstalled fd/fdfind if present (self-hosted
        # RHEL runners have no apt-get); only fall back to apt on Debian.
        #
        # LOOK IN ~/.local/bin BEFORE GIVING UP. Measured 2026-08-12: this step
        # failed on the self-hosted runner with "sudo: a password is required"
        # while `fd` was installed the whole time at
        # /home/ywatanabe/.local/bin/fd. That directory is added to PATH by the
        # login shell's profile, which a non-interactive Actions step does not
        # source — so `command -v fd` says absent, the else branch runs, and the
        # job dies on a package install it never needed.
        #
        # The tool was present; only the VANTAGE POINT differed. Probing the
        # known location costs one test and removes an entire failure class.
        #
        # And sudo is not a fallback here: this host reports HAS_SUDO=false, so
        # both sudo branches are unreachable by construction on the runner they
        # were written to rescue. They stay for apt-based hosts and are now
        # guarded, so their absence is reported rather than exploding.
        run: |
          set -euo pipefail
          if command -v fd >/dev/null; then
            echo "fd present: $(command -v fd)"
          elif [ -x "$HOME/.local/bin/fd" ]; then
            echo "fd present but off PATH: $HOME/.local/bin/fd — adding to GITHUB_PATH"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          elif command -v fdfind >/dev/null; then
            mkdir -p "$HOME/.local/bin"
            ln -sf "$(command -v fdfind)" "$HOME/.local/bin/fd"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          elif command -v sudo >/dev/null && sudo -n true 2>/dev/null; then
            sudo apt-get update && sudo apt-get install -y fd-find
            mkdir -p "$HOME/.local/bin"
            ln -sf "$(command -v fdfind)" "$HOME/.local/bin/fd"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          else
            echo "::error::fd not found, not at \$HOME/.local/bin/fd, and no passwordless sudo to install it. Install fd on this runner." >&2
            exit 1
          fi

      - name: Fetch develop into a remote-tracking ref for --new-only baseline
        # Fetch into refs/remotes/origin/develop (NOT the local develop
        # branch): on the push:[develop] trigger HEAD already IS develop, so
        # `git fetch origin develop:develop` dies with "refusing to fetch
        # into branch ... checked out". The remote-tracking ref is always
        # writable and `--since origin/develop` resolves it for the
        # worktree-staged diff on both push and pull_request events.
        run: git fetch origin develop

      - name: Install package + audit tooling (own editable checkout)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run scitex-dev ecosystem audit-all (self-audit, own code)
        run: scitex-dev ecosystem audit-all scitex-dev --new-only --since origin/develop --no-version-check
