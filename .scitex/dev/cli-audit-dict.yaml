# scitex-dev project-level CLI audit dictionary.
#
# Adds nouns and verbs that aren't in the bundled English catalog or Moby
# POS list but are legitimate domain terms in this package's CLI.
#
# Merged with `~/.scitex/dev/cli-audit-dict.yaml` (user-level) at audit
# time. Project entries take precedence on collision.

nouns:
  # Short form of "credentials" — used in `scitex-dev creds <verb>` for
  # the ecosystem-wide CLAUDE_CODE_CREDENTIALS_JSON rotation.
  - creds
  # The crontab-managed scheduled-job surface — `scitex-dev cron <verb>`
  # (list / install / remove / status / run).
  - cron
  # The systemd user-timer surface — `scitex-dev ecosystem systemd <verb>`
  # (list / install / uninstall) for federated scheduled jobs.
  - systemd
  # The long-running background-process surface —
  # `scitex-dev ecosystem daemon <verb>` (list / exec) for federated jobs.
  - daemon

transitive_verbs:
  # `scitex-dev ecosystem unset-branch-protection` — the rollback half
  # of the set/unset pair for GitHub branch-protection management.
  # "unset" is standard English (Bash builtin, shell vocab) but doesn't
  # sit in the Moby POS catalog the auditor consults.
  - unset
  # `scitex-dev ci runner use <target>` — flip CI_RUNS_ON for the
  # current repo's GitHub Actions workflow.
  - use
  # `scitex-dev registry-normalize <pkg>` — the operator-and-sac-agreed
  # public command name for the PS-181 registry-layout drift fixer (chosen to
  # sit next to `trace-env-vars`). The compound leaf reads `<noun>-<verb>`
  # (registry / normalize), so §1's leaf-head heuristic classifies the head
  # "registry" as a noun and flags it — but the command IS a transitive
  # action: it normalizes the registry for its required `<pkg>` object.
  # Declare the whole leaf a transitive verb so §1 doesn't misfire, exactly
  # like the `gate` / `unset` / `use` escape hatches above. Renaming a
  # shipped public command to satisfy the heuristic would be worse than this
  # one-line declaration.
  - registry-normalize
verb_exceptions:
  # `scitex-dev dev access check --principal ... --action ... --resource ...`
  # — renders an authorization DECISION (allow/deny + reason, tri-state exit
  # codes 0/10/11), not a config-validity verdict. `validate` would misdescribe
  # it: there is nothing to declare valid, only a principal/action/resource to
  # decide. Also a shared mountable surface (`register_access_group` mounts it
  # on EVERY leaf's `<pkg> dev`), so a rename must happen fleet-wide, not here.
  - check  # why: authorization-decision verb (renders a verdict), not config validation; shared mountable surface
  # `scitex-dev dev secret set` — stores one caller-supplied secret read from
  # stdin. That IS the doctrine's single-key-config-write sense of `set`, and
  # it is a shared mountable surface (`register_secret_group` mounts it on
  # EVERY leaf's `<pkg> dev secret`), so a rename must happen fleet-wide.
  - set  # why: single-key write (the sanctioned `set` sense); shared mountable surface
  # `scitex-dev ci verify <pr> --repo <owner/repo>` — a merge verdict a gating
  # hook reads via exit codes 0/10/11. Deliberately NOT `mergeable` (an
  # adjective parses as a claim, and the command's job is to REFUSE that claim)
  # and NOT `validate` (exit code 2 from old venvs answering "No such command
  # 'verify'" was already misread once as "NOT ready" — measured 2026-08-09 —
  # so the name is a gating-hook contract now, not a style choice).
  - verify  # why: gating-hook contract with documented exit-code history; renaming re-opens the exit-2 misread
  # `scitex-dev host resolve <name>` — DNS-style lookup ("resolve a
  # name to its record"), the standard meaning of "resolve" in
  # networking/registry contexts (cf. `dns resolve`, `pip resolve`).
  # The doctrine's `resolve -> done` synonym mapping targets a
  # DIFFERENT sense of the word: "resolve" as a terminal-state verb for
  # closing out a work item (task/issue) — `host resolve` never marks
  # anything done, it looks up a host record. Distinct meanings, same
  # spelling; exempting rather than renaming the public, spec-agreed
  # command.
  - resolve  # why: lookup verb (DNS/registry sense), not the task terminal-state verb
intransitive_verbs:
  # `scitex-dev ecosystem run` — run the collective ecosystem supervisor in
  # the foreground (the systemd ExecStart). "run" is an intransitive verb in
  # CLI convention (cf. `docker run`, `cargo run`, `make run`), but the
  # bundled Moby POS list classifies it noun-only, tripping §1. Declare it.
  - run
  # `scitex-dev ci runner preflight` — the fail-loud CI-readiness gate (for a
  # git pre-push hook). "preflight" is an intransitive verb in ops/CLI usage
  # ("preflight the deploy", cf. `terraform plan`); Moby classifies it
  # noun-only, tripping §1. It takes no object — it checks lease+runner state.
  - preflight
  # `scitex-dev gate <workdir>` — GATE a submission at a stage (run the
  # aggregated pre/post-submission checks, block on an enforced failure).
  # "gate" is a transitive verb here ("gate the submission"); Moby
  # classifies it both noun AND verb so §1 flags the noun reading. The verb
  # meaning is intended — the whole point is to GATE. Same escape hatch as
  # `run` / `preflight`.
  - gate
