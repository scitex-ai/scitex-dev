# scitex-dev `ci runner` — concrete operator-host config for the spartan-bm159
# self-hosted runner, pre-filled where the values are derivable. Operator
# replaces every <TODO_…> with the real value and `chmod 0600 ~/.scitex/dev/ci-runner.yaml`.
#
# Path to install at: ~/.scitex/dev/ci-runner.yaml
# Precedence (config.py): $SCITEX_DEV_CONFIG → $XDG_CONFIG_HOME/scitex/dev/ci-runner.yaml → ~/.scitex/dev/ci-runner.yaml
# This file is GITIGNORED; never commit a filled-in copy.

hpc:
  user:       ywatanabe                              # from `scontrol show job 26030530 -o` (UserId=ywatanabe)
  ssh_host:   spartan                                # the operator's existing ~/.ssh/config alias
  apptainer:  <TODO_/absolute/path/to/apptainer>     # run `module load Apptainer/1.3.3 && which apptainer` from spartan login
  # Dated SIF pin — NOT a floating "-latest" symlink. CI reproducibility
  # must not drift when the operator repoints the symlink.
  sif:        <TODO_/absolute/path/to/sac-scitex.sif.libxcb-YYYY-MMDD-HHMMSS>

runner:
  # Single self-hosted runner; the suffix is bumped when re-keying.
  name:       scitex-ci-runner-01
  # Canonical labels (matches src/scitex_dev/ci/runner/_use.py's flip target).
  labels:     [self-hosted, scitex-ci]
  # Persistent project storage. NOT $HOME (quota) and NOT scratch (purged).
  home:       <TODO_/absolute/path/on/punim2354/github_runner>
  wrap_log:   <TODO_/absolute/path/on/punim2354/github_runner/wrap.log>

ci_lease:
  # IMPORTANT: matches the existing SLURM job's name on spartan-bm159 (job 26030530).
  # `scitex-dev ci runner up` finds the lease by NAME (not jobid — jobids cycle on resubmit).
  # Change here if you rename the SLURM job.
  jobname:               spartan-ci-runner-permanent
  sbatch_script:         <TODO_/absolute/path/to/wrapper.sh-on-spartan>
  renew_threshold_min:   1440                          # 24h before walltime → resubmit successor

github:
  # Classic-PAT scopes: repo + workflow + actions:variables:write.
  # `scitex-dev ci runner use github|self-hosted` PATCHes the repo Actions
  # Variable CI_RUNS_ON via this token.
  pat_env:        SCITEX_DEV_GH_PAT
  # Start with scitex-dev (smallest blast radius). Roll to other repos via
  # `scitex-dev ci runner register <repo>` once the PR-A pilot is green.
  default_repo:   ywatanabe1989/scitex-dev
  variable_name:  CI_RUNS_ON

watchdog:
  poll_interval_sec:  60
  offline_grace_min:  5                                # runner offline this long → auto-flip + a2a ALERT
  alert_via:          a2a                              # one of: a2a, telegram, gh_issue
